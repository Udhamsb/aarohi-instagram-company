        body: "Re-edit complete — all three items done on the delivered bytes, AAR-3 now carries exactly one attachment per live deliverable name. Nothing was published; publish authority remains with the board (AAR-10).\n\n## 1. Disclosure badge moved to a safe area — 25/25 assets re-measured\n\nOld badge on all 25 9:16 assets: x=733, y=1753, 291x57 (bottom edge 1810 — inside the caption/audio reservation y>=1248, deleted by the 4:5 grid crop, right edge 1024 inside the action rail x>=853 below y=1150).\n\nNew position: x=700, y=1080, 291x57 (same plate size). Note: the issue's example y=1210 would have put the badge bottom at 1267 — inside the y>=1248 band it says to clear — so I used y=1080: bottom edge 1137 clears the rail band start (y=1150), the caption/audio reservation (y>=1248), and sits inside the kept grid band (285..1635).\n\nMeasured off the delivered bytes (re-downloaded), all 25 stills:\n- contrast 39.75:1 (AA needs 4.5); phone-preview gate (405px + JPEG q26 round-trip): 52.02:1, glyph coverage 12.4-12.7%\n- above_caption_band True 25/25, inside_grid_crop True 25/25, on-canvas 25/25\n- right margin 89 px, bottom margin 783 px\nReels: badge re-measured on decoded frames at t=1/8/15s per master, min contrast 52.02:1, above-band and in-grid on every sampled frame. Phone-gate JPEGs: 25 written.\n\nMethod: clean plate recovered per frame (OpenCV Telea fill of the old badge region), copy/headline layers untouched, badge re-composited at the safe position, reels re-encoded (zoompan motion on clean frame, fixed overlay — same pipeline as the shipped build_reels.py).\n\n## 2. Reel masters now carry audio — 5/5\n\nBefore: 1 stream (h264 video only), silent. After (per delivered master, ffprobe + astats):\n- AAR-W1-MON-REEL.mp4 id=20977696-1434-473d-ac49-cc613db5dcb7 — h264 + aac, 20.0s, RMS -25.5 dB\n- AAR-W1-WED-REEL.mp4 id=15ed7d68-cc8d-4454-b6fe-54cf491fa11f — h264 + aac, 12.0s, RMS -24.9 dB\n- AAR-W1-THU-REEL.mp4 id=5d8bdc72-552a-4b62-aa46-21e90c83de7d — h264 + aac, 16.0s, RMS -25.1 dB\n- AAR-W1-SAT-REEL.mp4 id=2835a199-2909-4d4e-a1ea-a882a30f4983 — h264 + aac, 16.0s, RMS -26.1 dB\n- AAR-W1-SUN-REEL.mp4 id=dce1b45e-c384-41f7-9320-79088d57af12 — h264 + aac, 16.0s, RMS -25.1 dB\n\nAudio = the package's Hinglish voiceover script (hi-IN female neural TTS) mixed over a rights-safe bed synthesized in code (no sampled music, no third-party audio). Durations land within ~0.2-2s of each reel's VO at natural pace; no board decision needed, so the silent-post escalation path was not used.\n\n## 3. AAR-3 attachment hygiene — one file per live name\n\nDeleted with per-id verification (200 on DELETE + 404 on re-download):\n- 11 superseded 18:47 pre-correction stills (FRI-STATIC 5070a362, TUE-CAR-S1..S5 905b75d6/6ab7d6c3/4dc65eda/9dca258b/eb1720e6, and the five retired *-REEL.png stills e25afbe9/a679eb53/60aa9b36/40239f8d/91a197c8)\n- 30 superseded versions replaced by this re-edit (old-badge stills, silent masters, old covers) — full old-id list in the run log; every current deliverable id is in section 2 above\n- 1 duplicate reel_registry.json (9f7c95cd, byte-identical) + 2 stale registries + 2 transient copies from an interrupted refresh\n\nFinal state (verified by re-list): 53 attachments, zero same-name collisions, zero retired -REEL.png names. manifest.json and reel_registry.json regenerated to match the re-edited assets (new bbox 700,1080,291x57; new sha256/bytes; audio provenance noted per reel).\n\n## Not changed\nTUE carousel S1-S5 (4:5) and FRI static: their badge at x=762,y=1211,262x53 sits outside the caption-band geometry flagged for 9:16 and is inside the grid by construction — untouched per issue scope. qa_report.json (v3 measurements) kept as history alongside the regenerated registries.\n\nNothing in this run publishes or schedules anything."
