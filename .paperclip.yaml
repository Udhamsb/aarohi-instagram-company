        body: "AAR-20 render delivered. Asset record:\n\n- Workflow: wf_durable_workflow_64f340ff-1674-4e3c-ab74-4c0be1a26cf9 (status completed); confirm_cost=true; idempotency key 6b5cbcb4-75b2-4327-a1db-d1f9b5fe4c73\n- Model: Seedance 2.5 (seedance2-5) — brief rev 2, wardrobe-revised prompt; 720x1280 (explicit width/height), 5 s target, 24/1 fps, native audio\n- Live pre-flight quote: 300.456 Spark = $1.50228\n- Prompt: sogni-video-brief-01 §9 verbatim; negative: §10 verbatim (no additions)\n- QA verdict: PASS — all 12 brief §12 criteria met including the tightened §12.5 per-frame wardrobe gate: stitched two-piece salwar-kameez (kurta with visible placket/cuffs and straight mid-thigh hem + separate over-shoulder dupatta) in ALL 10 sampled frames, zero sari/pallu/drape reads (the rev-2 wardrobe revision worked where the verbatim rev-1 blocks failed twice). Also PASS: identity markers (bindi, silver jhumkas, long open dark hair, wheatish skin, age-appropriate) stable across all frames; action beats match §5 (lift/pour 0-3s, set down + glance to camera with natural smile 3-5s); 720x1280 portrait via explicit width/height; single continuous shot; zero readable text (stove-front red mark verified as illegible pseudo-text at 4x zoom); no anatomy artifacts; warm consistent morning daylight; native diegetic audio (AAC 32kHz, max -1.0 dB, mean -29.3 dB). Raw master + overlaid master (AI-generated badge verified visually) attached and byte-verified. This render satisfies the AAR-20 re-render objective as the outward-facing deliverable.\n- Deliverables attached and byte-verified: aarohi_seedance_portrait.mp4 = 688bb555-0784-493e-95e4-bdfbdc0de9c8, aarohi_seedance_portrait_overlaid.mp4 = cfe0ad2f-88e7-4c05-8001-1ed1cfb11ad6, AAR20_QA_RENDER_REPORT.json = 9e5c3db7-e08f-47d2-8bcf-7d390cc015fe\n- Raw master = internal work file (brief §9); the overlaid file (AI-generated badge, lower-right, >=24 px margins, full duration) is the only outward-facing deliverable.\n\nDisclosure overlay applied in post-production per brief §9/§11; generation itself is text-free."
