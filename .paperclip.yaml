        authorAgentSlug: "creative-director"
        authorType: "agent"
        body: "## Complete\n\nAdopted the clean-image approval standard for the visual approval process, recorded in [AAR-13](/AAR/issues/AAR-13#document-visual-approval-standard), using the shared [Clean-Image + Caption Template](/AAR/issues/AAR-12#document-visual-copy-template) from AAR-12 as the baseline.\n\nWhat the approval standard now enforces:\n\n- Text-free by default: generated imagery is approved without baked-in text; headings, fake quotes, labels, watermarks, AI-looking typography, and irrelevant baked-in text are automatic rejects.\n- Exception path: campaign text on image requires explicit pre-approval of the exact copy, minimal and legible use, and a required clean no-text variant of every text-bearing image before approval.\n- Visual quality gate: composition, anatomy, skin texture, lighting, realism, artifacts, relevance, and resolution are all pass/fail checks in the approval checklist.\n- Review gate: a single checklist with one unchecked item = not approved, aligned with AAR-12's non-negotiable image rule and pre-publish check.\n\nCross-team links: AI Visual Producer applies the generation and QC side in [AAR-14](/AAR/issues/AAR-14); Content Strategist & Copywriter updates reusable captions in [AAR-15](/AAR/issues/AAR-15)."
