  aar-4:
    attachments:
      -
        byteSize: 17485
        contentType: "application/json"
        originalFilename: "aar4_week1_qa_checklist.json"
        sha256: "3e5c5cbad869522fadd7e01dfab938c1b896d7eaf7338b69f143cc4b05336645"
    blockedBy:
      - "aar-10"
      - "aar-11"
    comments:
      -
        metadata:
          version: 1
          authorizationReason: "internal_agent_write"
          sections:
            -
              title: "Authorization"
              rows:
                -
                  label: "Reason"
                  type: "key_value"
                  value: "internal_agent_write"
        authorAgentSlug: "community-insights-manager"
        authorType: "agent"
        body: "QA is done on all seven posts and nothing was published. AAR-4 is now blocked on AAR-10 (account + authority), with the blocker edge verified.\n\nWhat I actually measured, off the delivered bytes re-downloaded from AAR-3 (41 of 41 files matched the attachment registry by sha256 and byteSize — I did not reuse the producer's harness):\n\nPassed: §1 identity — one consistent face and age across all 31 visuals, hair worn fully down in every frame, small centred maroon bindi wherever the forehead shows, silver earrings visible on every frontal frame (five strongly turned frames occlude the far earring, which §1 allows). §2 modesty/pose/setting/copy — all opaque, no suggestive framing, no intimate settings, no appearance-led copy. §5 beginner safety on Mon/Thu/Sun, verified off the frames including the two regenerations the producer claims. Hinglish caption/CTA/hashtag lane, mix 3/2/2. Rights-safe audio by construction — the masters carry no audio at all, so nothing to clear.\n\nFour blockers:\n\n1. No Instagram connection and no publishing authority. Seven tool connections, none Instagram/Meta/social; the 46-app gallery has no such app; Zapier is live with 17 MCP tools but no IG account behind it. Raised as AAR-10, assigned to the board owner, parented to AAR-4.\n\n2. §4 disclosure placement — a real §4 failure. The badge at x=733, y=1753, 291×57 sits 100% inside Instagram's reserved bottom-672 px caption/audio band on all 25 9:16 assets, and 100% inside the band the 4:5 profile-grid crop deletes; its right edge reaches x=1024, inside the reserved action rail. Fix needs no regeneration: x=700, y=1210, 291×57 clears all three. The producer's contrast figures are sound (I measured 18.73:1 in-frame, 21.0:1 after a 420 px + JPEG q26 round-trip); it's purely placement.\n\n3. All five reel masters are video-only. Instagram uploads a silent 9:16 MP4 as a photo/clip, not a Reel, so the specified Hinglish voiceover is absent and the Reels tab doesn't apply.\n\n4. The superseded 18:47 build is "
        createdAt: "2026-09-22T02:46:50.815Z"
      -
        authorType: "user"
        body: "Can we use zernio mcp for this"
        createdAt: "2026-09-22T05:15:29.666Z"
      -
        metadata:
          version: 1
          authorizationReason: "internal_agent_write"
          sections:
            -
              title: "Authorization"
              rows:
                -
                  label: "Reason"
                  type: "key_value"
                  value: "internal_agent_write"
        authorAgentSlug: "community-insights-manager"
        authorType: "agent"
        body: "Answer to \"Can we use zernio mcp for this\": yes — it's a working publishing path and the best one reachable from this runtime, but it does not by itself clear the blocker.\n\nI checked it live rather than taking the vendor page's word:\n\n- https://mcp.zernio.com/mcp is up (Zernio MCP Server v1.2.1, streamable HTTP), /health returns healthy.\n- Unauthenticated initialize and tools/list both return 401 with correct OAuth 2.1 discovery metadata, and dynamic client registration works — POST to zernio.com/api/oauth/register returned 201. So a client can register itself and walk the owner through sign-in.\n- Instagram publishing (feed, carousels, Stories, Reels), analytics, comments and DMs are all covered, with an API-key path for headless agents. Scopes include posts:write and accounts:read.\n\nIt isn't connected here: no Zernio in the 46-app Paperclip gallery (so it can't go through Paperclip's app flow — it's a Hermes-side MCP server), no Zernio in the 73-entry Hermes MCP catalog, no MCP server configured in this profile, and no Zernio credential in any env or secrets store. I ran hermes mcp add zernio --url https://mcp.zernio.com/mcp --auth oauth; it correctly detected OAuth and stopped at \"non-interactive environment and no cached tokens found.\" config.yaml is byte-identical to before — I declined to save a server entry that would fail its probe on every future startup. The grant needs a human at a browser.\n\nTwo things Zernio actually improves beyond just connecting an account:\n\nAudio. This is the better fix for the silent-master defect. Zernio attaches a licensed track from Instagram's audio catalogue via audioConfiguration/audioId, so the reels can ship with cleared music instead of no audio at all — but it requires connecting with loginMethod=facebook_login, or Meta returns 400 instagram_audio_requires_facebook_login.\n\nInstagram's own AI label. isAiGenerated: true makes Instagram label the media as AI-generated. Worth switching on, but it is not a substitute for Persona"
        createdAt: "2026-09-22T05:26:26.258Z"
      -
        authorType: "user"
        body: "Published. Aarohi Week 1 is live on @aarohi.kapoor.diaries: Tuesday's carousel is posted and the remaining six days are scheduled at a consistent 20:00 IST.\n\nWhy it could go out now: AAR-10 was closed done by the board with the Zernio MCP wired in. I verified the connection and the account rather than taking the close-out at face value — `accounts_get_all_accounts_health` reports aarohi.kapoor.diaries as healthy, canPost true, token valid, needsReconnect false. Two Instagram accounts are connected, so I passed the account_id explicitly on every post instead of letting it auto-resolve.\n\nI re-QA'd the re-edited bytes before publishing, off bytes re-downloaded from AAR-3 (38/38 sha256 + byteSize matched the registry):\n\n- Disclosure badge: the plate sits at (700,1080,291x57) on 25/25 9:16 assets by exact-fill test, and the old defective position (733,1753) is now empty on all 25. Bottom edge 1137 clears the caption/audio band at y>=1248; right edge 991 clears the action rail; it stays inside the 4:5 grid crop. The producer's y=1080 is right and my earlier y=1210 suggestion was wrong — 1210 would have put the badge bottom at 1267, back inside the band.\n- Audio: all five reel masters now carry h264 + AAC at unchanged durations (20/12/16/16/16s).\n- Hygiene: 53 attachments, zero duplicate filenames; the superseded 18:47 build is gone.\n\nCalendar, all seven posted or scheduled:\n\n| Day | Date | Format | Zernio ID | Status |\n|---|---|---|---|---|\n| Tue | 2026-09-22 | carousel x5 | 6ab21c1013e2cd514b3d63d7 | published |\n| Wed | 2026-09-23 | reel | 6ab21c5bea3a3c8c1e37346b | scheduled 20:00 IST |\n| Thu | 2026-09-24 | reel | 6ab21c60fe66fba341815bf4 | scheduled 20:00 IST |\n| Fri | 2026-09-25 | static 4:5 | 6ab21c63a5cf35afa3c9795f | scheduled 20:00 IST |\n| Sat | 2026-09-26 | reel | 6ab21c678947239137dc5b33 | scheduled 20:00 IST |\n| Sun | 2026-09-27 | reel | 6ab21c6bea3a3c8c1e373723 | scheduled 20:00 IST |\n| Mon | 2026-09-28 | reel | 6ab21c708947239137dc5c1a | scheduled 20:00 IST |\n\nTuesday is genuinely live, read back from the platform: platformPostId 18095719958399390, publishedAt 2026-09-22T06:12:24Z. That's Instagram's own media ID, so the post exists on Instagram and not just in Zernio. validate_post returned \"No validation issues found\" on 7/7, and all 11 uploaded media URLs re-validated at HTTP 200 with byte-identical sizes. isAiGenerated is set on all seven, so Instagram applies its own AI label — on top of the burned-in Persona Bible section 4 badge, not instead of it.\n\nFour things the board should know:\n\n1. Monday is 28 Sep, the following week's Monday. The account only became postable today, and the copy is weekday-branded, so I kept each post on its own weekday rather than posting Monday out of sequence. Say the word if you'd rather compress Week 1.\n2. Tuesday published before I could schedule it. Its create call returned a 502, but the post went live anyway at 06:12:24Z. I read the account back before retrying, so there is no double-post — but the practical lesson is that this tool's error responses are not reliable evidence that nothing was published.\n3. I used one fixed slot (20:00 IST) rather than varying the first 2-3 slots as the launch plan suggests. No A/B rotation was invented for a brand-new account with no data.\n4. No licensed music track: audioConfiguration needs the account connected via Facebook Login, which this one is not. The reels carry the package's own Hinglish voiceover and rights-safe bed.\n\nDurable evidence is in the document `publication-record` on this issue. The full criterion-by-criterion QA checklist remains in `week-1-pre-publish-qa`.\n\nNothing was fabricated and nothing was published that I had not first measured. Setting AAR-4 to done."
        createdAt: "2026-09-22T06:14:46.044Z"
    completedAt: "2026-09-22T06:14:46.149Z"
