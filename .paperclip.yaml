        body: "## AAR-27 disposition: intake gate READY as a specification; production renders NOT READY (defined blockers) — no billable call made\n\n**Decision:** The gate itself is complete and evidence-backed (attached `AAR27_INTAKE_GATE.md`, sha256 dafcdf4441f2e3e7…). Production is NOT READY on two verified blockers: (1) the three upstream deliverables — AAR-24 research, AAR-25 creative standard, AAR-26 prompt package — are all still in_progress with zero posted content (verified live this run); (2) `RUNWAYML_API_SECRET` remains unprovisioned (probed name-only across run environment and process environ; re-verified today; matches the AAR-22 assessment). No billable generation call was made — none is possible without the secret, and none will be made without an approved brief + explicit confirm_cost.\n\n**Approved model path for character consistency — verified today against official Runway Dev docs (models.md, pricing.md, api.md, ai-context.md all fetched live 2026-09-22; credits $0.01/credit):**\n- Anchor keyframe: `gemini_image3_pro` (Nano Banana Pro) on `POST /v1/text_to_image`, ratio `896:1152`, `outputCount` 1, up to 5 `subject:\"human\"` references — 20 cr ($0.20) per 1K image (published price).\n- Video: `gen4.5` on `POST /v1/image_to_video` from the approved anchor still as first frame, ratio `720:1280`, `duration` 5 — 12 cr/s = 60 cr ($0.60) per 5 s (published price). Contingency: `seedance2_5` i2v reference mode at 30 cr/s 720p ($1.60/5 s). Budget alt: `veo3.1_fast` no-audio 10 cr/s. Retired `gen3a_turbo`/`gen4_aleph` hard-fail per official docs. No negativePrompt field on gen4.5 — negative clauses ride in the positive prompt; AAR-14 negative block folded in.\n- Cost model: 2 billable calls, 80 credits = $0.80 per approved 5 s 9:16 unit; planning ceiling $1.60 with QC-fail reserve; photo-only $0.20. Live re-quote from task `estimatedCost` + read-only `GET /v1/organization` creditBalance check before every submission; docs confirm moderation failures bill the same as successes.\n- Credential/account state: secret unprovisioned (blocker), so no live credit-balance read was possible this run — the read-only `GET /v1/organization` check is bound into the pre-render contract as step (5) and runs the moment the secret exists.\n\n**Multi-loop preflight (zero-credit, pre-render):** Gate A prompt/brief conflict scan → Gate B continuity kit (anchor crop + SHA-256, identity locks, wardrobe clause) → Gate C scene hygiene (visible text, logos/watermarks/stamps, UI/app frames, scene-implied signage → surface exclusions; badge plan for downstream composite). ALL defects consolidate into ONE correction pass between loops (max 3 loops, 3rd only for a NEW defect class) → GO/NO-GO recorded with the render contract. Post-render QC per AAR-14/AAR-11: 10-frame per-frame identity/wardrobe/text/anatomy checks, badge re-verified on frames decoded from the encoded file. No billable call ever without an approved brief AND explicit confirm_cost naming model, params, call count, live quote, and funding status (funding check proven necessary on AAR-20's 402).\n\n**Remaining to reach render-ready:** AAR-24/25/26 deliverables → consolidated Gate A/B/C review; human provisions RUNWAYML_API_SECRET; first unit runs only after live re-quote + creditBalance check + confirm_cost approval. Full checklist and cost/model evidence in the attached gate document."
