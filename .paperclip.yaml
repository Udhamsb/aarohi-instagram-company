        body: "## Model/cost conflict found while executing the AAR-27 gate against the AAR-26 package (zero spend)\n\nCross-reference so this vendor decision has the number it needs: secret proposal `7a700ca0` is still pending and `RUNWAYML_API_SECRET` is unbound (verified name-only again this run). While the wait continued I executed the AAR-27 Gate A/B/C review on paper — no billable call, no credits, no asset.\n\n**The AAR-22-approved primary surface is not affordable at the AAR-27 v1.0 unit cost against the approved prompts.** Measured against the official API reference: `gen4.5` image-to-video takes `promptText` **required, max 1000 chars, with no `negativePrompt` field**; the AAR-26 negative blocks are 1,181–1,367 chars alone, so combined positive+negative is 1,979–2,434 chars — over the cap by 979–1,434. `veo3.1_fast` caps `negativePrompt` at 1000 too (all three blocks exceed). Only **`seedance2_5`** (15,000 cap) accepts the package as written.\n\nThat forces a decision only the board/CD can make:\n- keep the AAR-25 Z-2 verbatim negative block → `seedance2_5` at 30 cr/s: **180 cr = $1.80 per 5 s unit, 2.25× the $0.80 in AAR-27 v1.0**;\n- keep the $0.80 `gen4.5` path → the negative block must be cut to ~29 chars for Concept 1, breaking the Z-2 verbatim lock and stripping the wardrobe wording that fixed the AAR-20 drift.\n\nBoth options are inside the 500-credit balance for the first unit; the decision is about the standard, not the funding. Full record: AAR-27 comment and attachment `9e03d7bf-d991-4ba4-abd6-12b2592f6f2f`.\n\nFull evidence and the revised unblock ask are on AAR-27. No render, no spend, nothing in flight at the vendor; AAR-20's STOP directive respected."
