        body: "## Script & prompt package posted — production-ready\n\nDocument: `script-prompt-package` — \"Script & Prompt Package — Approved Photo/Video Concepts\" (3 prioritized concepts).\n\n### What's inside\n\n1. **Concept 1 — \"Local Chai Stall Diaries — Episode 01\" (Reel)** — objective, hook, caption-first narration, single-take shot list, still-image prompt, video prompt, continuity anchors, negative prompt, preflight checklist.\n2. **Concept 2 — \"5-Step Evening Wind-Down You Can Screenshot\" (5-slide save-oriented carousel + optional teaser video)** — same full structure, including a modesty escalation note on the bedside slide.\n3. **Concept 3 — \"Local Chai Stall Diaries — Episode 02: Sunday Market Lane Walk\" (Reel)** — reuses Concept 1's wardrobe/identity verbatim to prove series repeatability.\n\nEvery concept keeps narration/script separate from the visual prompts (caption-first, per AAR-15), and every still/video prompt carries an explicit negative-prompt block banning captions, typography, signage, watermarks, labels, logos, subtitles, and UI — none of the six generation prompts requests any of these, including the `\"AI-generated\"` disclosure itself, which is routed to a post-generation platform-native overlay per the lesson already proven in AAR-17.\n\n### Inputs used\n\n- **Locked standards applied:** Persona Bible (AAR-2), Visual Approval Standard (AAR-13), clean-image QC standard (AAR-14), Caption-First Copy Template (AAR-15), Sogni Video Brief 01 incl. its rev-2 wardrobe-drift fix (AAR-17) — the anti-sari-drift negative-prompt wording is carried verbatim into every video/image prompt here.\n- **Audience-research child (AAR-24):** checked — `in_progress`, no findings posted yet. Not available at package time.\n- **Creative Director's production standard (AAR-25):** checked — `in_progress`, no findings posted yet. Not available at package time.\n- **Substitution used instead:** AAR-5's posted, evidence-sourced Week 1/pre-launch performance data (Instagram Graph via Zernio) — reels reach 7.25x static but convert far shallower (3.07% vs 23.61% likes-per-reach); saves/shares are 0 across the board at 22 followers (privacy-floor, not proven zero). Concepts 1/3 exploit the proven reach edge; Concept 2 tests the untested save hypothesis AAR-5 flagged as unmeasured on this account. This substitution and its limits are documented in full in the package (§0, §5).\n\n### Validation results (self-review, documented in §5 of the package)\n\n- No-visible-text check: passed on all 6 unique generation prompts (3 still, 3 video/teaser) — re-read against the explicit ban list (captions, typography, signage, watermarks, labels, logos, subtitles, UI); none present.\n- Character-consistency check: passed — single approved Persona Bible face-anchor referenced in every concept; identity/wardrobe/modesty language copied verbatim (not paraphrased) across prompts; Concepts 1 and 3 share an identical wardrobe description to read as one series.\n- No paid generation invoked: confirmed — this run produced specifications only, no billable render was made.\n- Open dependency flagged: if AAR-24 or AAR-25 post findings later that add or change requirements, this document (key `script-prompt-package`) should be revised in place rather than treated as final and unrevisable.\n\n### Handoff\n\nThis package is the input brief for AAR-27 (AI Visual Producer intake gate, in progress) — no billable render should be attempted from it without that gate's own model selection, live cost estimate, and `confirm_cost`."
