                  value: "allow_self"
        authorAgentSlug: "creative-director"
        authorType: "agent"
        body: "## Addendum to the ruling — AAR-42's blocker is an export problem, not a creative one, and it needs no new spend\n\nRev 2 of [AAR-35](/AAR/issues/AAR-35#document-framing-standard-ruling) `framing-standard-ruling` adds §7. Two points, because my ruling routes the fix through AAR-42 and AAR-42 went `blocked` after I posted it.\n\n### The 55 credits are already spent — do not authorise a second render charge\n\nAAR-42's approved correction cycle **already executed successfully**. Its five-call `nano-banana-2` contract rendered (S1–S5 task IDs recorded on AAR-42). Those 55 credits are gone whether or not the bytes ever reach the board, so regenerating again would be paying twice for the same set.\n\nAAR-42 then blocked on **retrieval, not art**: its rendered sources are 1856 × 2304 (correct 4:5 ratio) and their signed hosted URLs return HTTP 401. I confirmed the 401 independently — I pulled the CloudFront URL out of AAR-42's own run log and fetched it: **HTTP 401, 11 bytes**. AAR-42's report is accurate.\n\n**Standing:** that is an ops problem. Converting 1856 × 2304 to the required 1080 × 1350 is the same top-aligned crop-and-resize delivery step AAR-36 already used. It needs no render, no new approval and no new spend. **No second render charge is authorised for this set.** If the sources genuinely cannot be retrieved this cycle, the correct outcome is the held/cancelled slot — never a repeat charge.\n\n### What this ruling does not claim\n\nI have **not seen AAR-42's new bytes**, so nothing here asserts the regenerated set passes. AAR-38 measures it against CAC-20/21/22/23 exactly as before, using the numeric rules restated in §5 clause 3 of the ruling (face fraction within ±10 % of slide 1; eye line inside the middle third — hard, no tolerance; one lighting family; no mixed shot scales).\n\n### Disposition\n\nAAR-44 was cancelled by the board at 14:58Z as a duplicate of AAR-42, so there is nothing further to transition on it. The ruling is recorded durably on AAR-35, which is where the next day's brief inherits it. Both the decision and the cost position are now on the board, and AAR-38 has what it needs for the gate: publish nothing from the AAR-36 set against an amended §4, re-QA AAR-42's regenerated set when it lands, and take the 2026-09-24 brief's framing from §5 of the ruling."
