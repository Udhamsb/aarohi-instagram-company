        authorType: "user"
        body: "## Clean-image generation & QC standard — applied and verified\n\nStandard adopted per [AAR-12](/AAR/issues/AAR-12#document-visual-copy-template); full operational record in the attached `AAR14_CLEAN_IMAGE_STANDARD.md`.\n\n**Model & resolution (standing default, documented per handoff):** `google/gemini-3-pro-image` via the approved OpenRouter configuration (key sourced from profile env at call time only — never exposed or copied). Default output 928×1152 (4:5). Budget alternative that passed the same QC: `google/gemini-3.1-flash-image` (~$0.07 vs ~$0.14, ~12 s vs ~23 s). `openai/gpt-5.4-image-2` rejected: square-only, ~5× latency.\n\n**Operational checklist (now binding for all new visual assets):**\n1. Prompt baseline from AAR-12; identity-condition on an approved anchor crop (face + hair, above shoulders) whenever the persona appears; identity + marker locks verbatim.\n2. Mandatory negative-constraint block verbatim in every prompt: text, letters, numbers, captions, subtitles, signage, labels, typography; logos, brand marks, watermarks, stamps; UI elements, app frames, phone-screen UI, fake quotes, speech bubbles; irrelevant decorative elements. Plus surface exclusions when the scene implies boards/screens.\n3. Default deliverable is a clean, text-free image — story, CTA, disclosure, hashtags live in the caption / native reel text layer.\n4. Approved-text exception: explicit approval required; deliver BOTH the approved-text asset and a clean no-text variant of the same scene; pin the exact string, style and placement in the prompt.\n5. Final QC gate before handoff: anatomy, identity consistency vs anchor, lighting, skin/texture realism, artifacts, scene relevance, output resolution/aspect, and a zero-text check across every region.\n6. Per-asset documentation: model id, resolution, anchor id + SHA-256, asset SHA-256, prompt + exclusion blocks, QC verdict.\n7. Rejection loop: failed gate → regenerate with the named fix → re-run the FULL QC pass → log rule/finding/remedy/verdict.\n\n**Standard proven end-to-end on this issue (evidence attached):**\n- `AAR14_STANDARD_CLEAN.png` — clean no-text variant, 928×1152, PASS all gates (sha256 fbf9e071…).\n- `AAR14_STANDARD_TEXT.png` — approved-text variant (\"Slow mornings, strong starts.\" rendered exactly), 928×1152, PASS all gates (sha256 e2050277…).\n- Rejection loop exercised for real: QC pass 1 caught a background chalkboard menu with illegible writing in both variants (violation of the no-signage rule); both were regenerated with explicit background-surface exclusions and re-passed the full QC gate. Identity held via anchor crop (SHA 509936004fcf9c59…); hands/anatomy verified; no artifacts."
        createdAt: "2026-09-22T06:57:35.223Z"
    completedAt: "2026-09-22T06:57:35.301Z"
