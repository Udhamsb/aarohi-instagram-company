schema: "paperclip/v1"
agents:
  ai-visual-producer:
    role: "designer"
    icon: "wand"
    capabilities: "Produces and quality-checks Aarohi’s AI visual assets against the persona bible, disclosure, and editorial-safety requirements using approved Runway Dev tools."
    adapter:
      config:
        command: "codex"
        engine: "auto"
        timeoutSec: 3600
      type: "codex_local"
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
      -
        permissionKey: "tasks:assign"
    inputs:
      env:
        HERMES_HOME:
          description: "Optional default for HERMES_HOME on agent ai-visual-producer"
          kind: "plain"
          default: "/root/.hermes/profiles/ai_visual_producer"
          portability: "system_dependent"
          requirement: "optional"
  chief-of-staff:
    role: "general"
    adapter:
      config:
        apiBaseUrl: "http://127.0.0.1:8642/p/chief_of_staff"
        apiKey:
          version: "latest"
          projectionClass: "unclassified"
          secretId: "87ecd40d-3f4d-4f97-b7f0-783f28a495ec"
          type: "secret_ref"
        graceSec: 15
        sessionKeyStrategy: "issue"
        timeoutSec: 3600
      type: "hermes_gateway"
    runtime:
      heartbeat:
        intervalSec: 300
        skipTimerWhenNoActionableWork: true
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
      -
        permissionKey: "tasks:assign"
    inputs:
      env:
        HERMES_HOME:
          description: "Optional default for HERMES_HOME on agent chief-of-staff"
          kind: "plain"
          default: "/root/.hermes/profiles/chief_of_staff"
          portability: "system_dependent"
          requirement: "optional"
  community-insights-manager:
    role: "researcher"
    icon: "radar"
    capabilities: "Owns approved publishing operations, safe community response guidance, performance reporting, and Week 2 recommendations."
    adapter:
      config:
        apiBaseUrl: "http://127.0.0.1:8642/p/community_insights_manager"
        apiKey:
          version: "latest"
          projectionClass: "unclassified"
          secretId: "551c55e2-8f2d-4db6-99ac-9be98c2d289e"
          type: "secret_ref"
        sessionKeyStrategy: "issue"
        timeoutSec: 3600
      type: "hermes_gateway"
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
      -
        permissionKey: "tasks:assign"
    inputs:
      env:
        HERMES_HOME:
          description: "Optional default for HERMES_HOME on agent community-insights-manager"
          kind: "plain"
          default: "/root/.hermes/profiles/community_insights_manager"
          portability: "system_dependent"
          requirement: "optional"
  content-strategist-copywriter:
    role: "general"
    icon: "message-square"
    capabilities: "Owns Aarohi's weekly content calendar, scripts, captions, calls to action, and warm Hinglish voice."
    adapter:
      config:
        command: "claude"
        engine: "auto"
        model: "claude-sonnet-5"
        timeoutSec: 3600
      type: "claude_local"
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
      -
        permissionKey: "tasks:assign"
    inputs:
      env:
        HERMES_HOME:
          description: "Optional default for HERMES_HOME on agent content-strategist-copywriter"
          kind: "plain"
          default: "/root/.hermes/profiles/content_strategist_copywriter"
          portability: "system_dependent"
          requirement: "optional"
  creative-director:
    role: "designer"
    icon: "sparkles"
    capabilities: "Owns Aarohi's persona bible, visual identity standards, and approval criteria for consistent, safe editorial creative."
    adapter:
      config:
        apiBaseUrl: "http://127.0.0.1:8642/p/creative_director"
        apiKey:
          version: "latest"
          projectionClass: "unclassified"
          secretId: "945dca2f-2dc0-4889-951d-818819bb8a7d"
          type: "secret_ref"
        sessionKeyStrategy: "issue"
        timeoutSec: 3600
      type: "hermes_gateway"
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
      -
        permissionKey: "tasks:assign"
    inputs:
      env:
        HERMES_HOME:
          description: "Optional default for HERMES_HOME on agent creative-director"
          kind: "plain"
          default: "/root/.hermes/profiles/creative_director"
          portability: "system_dependent"
          requirement: "optional"
