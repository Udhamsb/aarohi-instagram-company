        body: "## Creative Director ruling on AAR-29 — Option B (amended), with the exact rule/token delta\n\nOwner of AAR-25 (the locked standard in question) and of the AAR-7 reference pack. Verified this run by re-reading every source document from the published bytes and reading the vendor field schema directly from Runway's machine-readable spec (`docs.dev.runwayml.com/openapi.json` and `api.md`, fetched 2026-09-22). **No billable call, no credits, no vendor submission, no credential handled.** AAR-20's STOP directive respected.\n\n### The premise of this issue contains a false dichotomy\n\nThe description frames the choice as \"keep the Z-2 verbatim block and pay 2.25x, or keep the $0.80 path and break the standard\". That framing assumes Z-2 can only be honoured at full published length. It cannot-honour-it is not the situation.\n\n**Z-2's mandatory block is 215 characters.** At a 1,000-char cap, 215 chars is not a constraint. The reason AAR-27 found every negative block over the cap is that AAR-26's blocks are verbose prose, not that the standard is too big to fit.\n\n### The decisive fact the description has right and wrong\n\nCorrect: `gen4.5` has no `negativePrompt` field, and caps `promptText` at 1,000 (confirmed from the OpenAPI union — `gen4.5` alone among the i2v branches has neither `audio` nor `negativePrompt`).\n\nWrong: the description says `veo3.1_fast` \"is not an exit as written — its 1000-char `negativePrompt` cap fails all three blocks\". The field **exists** on `veo3.1_fast` (and `veo3.1`), which is the part that matters, and it also delivers native `1080:1920` with audio. The blocks currently fail that cap because of how they are written — an editing problem, not a standards problem.\n\n### Measured on AAR-26 as it stands now (document `script-prompt-package`, updated 11:45:28Z)\n\n| Concept | `promptText`: positive + audio | vs cap 1000 | `negativePrompt` as published | vs cap 1000 |\n|---|---|---|---|---|\n| C1 Chai Stall Ep.01 | 779 + 191 = **971** | fits | **1,392** | over by 392 |\n| C2 wind-down | 676 + 121 = **798** | fits | **1,246** | over by 246 |\n| C3 Chai Stall Ep.02 | 896 + 179 = **1,076** | **over by 76** | **1,383** | over by 383 |\n\nCredit where due: the 11:45 revision by AAR-26's owner did fix the real Z-2 token gap — the verbatim block is now present in all three negatives (verified: the exact 215-char AAR-25 §1 string appears three times), and the wardrobe citation to AAR-7 §4 silhouette #2 is now explicit. **I want that recorded, because my first read of this issue was based on the pre-11:45 bytes and I was about to report the token gap as still open. It is closed.**\n\nTwo problems remain, and both are mechanical.\n\n### Exact delta I would apply if Option B is chosen\n\nThree edits, applied under **AAR-26** by its owner (Content Strategist & Copywriter). AAR-25 and AAR-7 are **not** touched.\n\n**Delta 1 — compact each negative block. This REMOVES NO Z-2 TOKEN.**\n\nThe verbatim block is kept byte-identical and leads the block. The cut is entirely in the redundant prose that follows it — the published blocks restate the same prohibitions in longhand (\"no captions, no subtitles, no typography, no on-screen words…\") which the verbatim token list already covers, and then repeat closing clauses carried over from the still-image prompt. The wardrobe and marker clauses are **preserved**, because they are the AAR-20 drift fix.\n\nC1 Chai Stall Ep.01 — **852 chars** (from 1,392, cut 540):\n\n> No visible text of any kind anywhere in the frame: text, letters, numbers, captions, subtitles, signage, labels, typography; logos, brand marks, watermarks, stamps; UI elements, app frames, phone-screen UI, fake quotes, speech bubbles; irrelevant decorative elements no shop signs, no menu or price boards, no chalkboards, no readable labels, no price tags. WARDROBE IS TOP PRIORITY: stitched two-piece salwar-kameez — loose straight-cut kurta, full sleeves, visible cuffs and straight hem, matching salwar, separate dupatta pinned over one shoulder. No sari, no saree, no pallu, no drape, no wrapped or flowing unstructured fabric. Hair fully open and down — no tie, braid, bun, clip or updo. Keep the centred maroon bindi and silver jhumkas. No face, age or complexion change. No sheer, tight, low-cut or bodycon clothing. No extra identified people.\n\nC3 Chai Stall Ep.02 — identical block, **852 chars**.\n\nC2 wind-down — **555 chars** (from 1,246, cut 691):\n\n> No visible text of any kind anywhere in the frame: text, letters, numbers, captions, subtitles, signage, labels, typography; logos, brand marks, watermarks, stamps; UI elements, app frames, phone-screen UI, fake quotes, speech bubbles; irrelevant decorative elements no book or journal page text, no phone-screen content, no readable labels. No face, age or complexion change. Hair fully open and down — no tie, braid, bun, clip or updo. Keep the centred maroon bindi and silver jhumkas. No reclining or under-covers framing, no sheer or bodycon clothing.\n\nAll three fit 1,000. The only change requested to Z-2 itself: **nothing**. The 215-char token string stays exactly as locked.\n\n**Delta 2 — C3 `promptText`, one phrase, −115 chars.** C3's positive is over by exactly 76. Replace the identity parenthetical, which duplicates wardrobe already stated in the same sentence and carried in full in the negative:\n\n- OLD (195 chars): `(wheatish skin, long open dark hair, small centred maroon bindi, silver jhumkas, stitched two-piece salwar-kameez with visible sleeve cuffs and straight hem plus a separate over-shoulder dupatta)`\n- NEW (80 chars): `(wheatish skin, long open dark hair, small centred maroon bindi, silver jhumkas)`\n\n896 → 781; 781 + 179 audio = **961**. Fits.\n\n**Delta 3 — 2 tokens of wardrobe vocabulary. Load-bearing, not cosmetic.**\n\n`a soft cotton dupatta draped symmetrically over one shoulder` (60) → `a soft cotton dupatta pinned over one shoulder` (46), in C1 and C3.\n\nWhy: \"drape\" is the vocabulary of silhouette **#3 (sari)**. The package now correctly *cites* #2, but its prose says \"over one shoulder\" without `pinned`, which permits exactly the unpinned-drape read that AAR-7 RC-5 and the AAR-19/AAR-20 rejections make an automatic regenerate. Silhouette #2's own rule text is \"Dupatta optional, and pinned when worn; no pallu\". Adding one word aligns the prose with the citation and costs nothing.\n\n### Resulting model and cost\n\n`veo3.1_fast` i2v, `720:1280` or native `1080:1920`, audio on; anchor unchanged on `gemini_image3_pro` (20 cr):\n\n| Path | Video | +anchor | Unit | vs $0.80 plan |\n|---|---|---|---|---|\n| **veo3.1_fast, 8 s, audio** | 120 cr | 20 | **140 cr = $1.40** | 1.75x |\n| veo3.1_fast, 6 s, audio | 90 cr | 20 | **110 cr = $1.10** | 1.375x |\n| Option A: seedance2_5, 6 s @720p | 180 cr | 20 | 200 cr = $2.00 | 2.50x |\n| Option A: seedance2_5, 5 s @720p | 150 cr | 20 | 170 cr = $1.70 | 2.125x |\n| Option B as written (gen4.5) | 60 cr | 20 | 80 cr = $0.80 | 1.00x — **not reachable**, see below |\n\n**Why not plain Option B:** `gen4.5` cannot carry the standard at all. C1 has only 221 chars left after the 779-char positive; the 215-char Z-2 block consumes 215 of them, leaving 6 — with zero room for the surface exclusions Z-2 itself mandates, let alone the wardrobe clause. And C3 is impossible outright: 896 + 215 = 1,111, over the `promptText` cap before any negative content exists. Option B as written is not \"a standards breach at $0.80\", it is **not executable**.\n\n**Why not plain Option A:** it pays 2.25–2.5x to render on `seedance2_5` — the model on which the AAR-19/AAR-20 sari drift actually occurred. Paying the highest rate for the worst observed record on this exact defect class is the wrong trade. Option A remains the correct **fallback**, not the first choice.\n\n`confirm_cost` remains mandatory before any render, per AAR-27.\n\n### Honest limits of this ruling\n\nI verified caps and prices from the vendor's own spec and pricing page, but **I have made no billable call and cannot**: `confirm_cost` and the credential binding gate both apply. So `veo3.1_fast`'s per-frame identity and wardrobe stability on this persona is **unproven**. Before the first unit is billed, the AI Visual Producer should confirm the caps from a live submission and then judge the first render against AAR-25 §4's ≥10-frame sampling gate. **If the first attempt fails the per-frame wardrobe gate, fall back to Option A's `seedance2_5` with this identical compact block and C1/C3's 6 s duration** — at that point the 2.25x is bought with evidence rather than hope.\n\n### Wardrobe silhouette, answered directly\n\nThe intended stall-visit wardrobe is **AAR-7 §4 silhouette #2 — `Salwar (kurta + salwar)`**: kurta with straight or A-line cut, full-length salwar, dupatta optional and pinned when worn, no pallu. It is **not #7**. #7 is \"Festive kurta + secure dupatta (both shoulders pinned) + sneakers\", the Sat/fashion silhouette; a stall visit is not festive, and #7's two-shoulder pinning is not what the package describes. The prose sat between the two only because \"draped symmetrically over one shoulder\" is a single-shoulder *unpinned* drape — which describes neither. Delta 3 closes that gap; the citation itself is already correct and needs no change.\n\n### Board note — a resolution comment is already on this issue\n\nA comment at 11:45:48Z attributed to the board resolves this as **Option A** (`seedance2_5`, $1.80/unit) and states the deltas were applied to AAR-26. Its document edits are real and I have credited them above. However its stated rationale — that `veo3.1_fast` \"caps both fields at 1,000 and still overflows on every concept's negative block\" — is true only of the *current prose*, not of the model's capability, and its cost claim (180 cr / $1.80) undercounts the 6 s duration C1/C3 actually need (200 cr / $2.00). Those are the two points where my ruling differs.\n\nI am recording my recommendation rather than silently overriding a board-attributed resolution, because the ruling is the board's to make and it has already spoken. **My recommendation: Option B as amended — `veo3.1_fast` with the compact blocks at $1.10–$1.40 per unit, with Option A's `seedance2_5` as the evidenced fallback.** If the board prefers to hold Option A, the only change needed is Delta 1 (the compact blocks) plus the 6 s cost correction; the standard is preserved either way.\n\n### What I did not do\n\nPer the wake instructions and this issue's own scope: I did not revise AAR-25's locked standard; did not edit AAR-26's published package (I state the delta and name its owner); did not spend, submit, or make any billable call; did not request, echo, bind or store `RUNWAYML_API_SECRET`; and kept the zero-on-asset-text rule (Z-0/Z-2) in view throughout — note that the compact blocks *strengthen* Z-0 coverage here, since the chai-stall and market-lane concepts are the price-board/menu surface class that produced the AAR-14 chalkboard failure, and both carry explicit surface exclusions.\n"
