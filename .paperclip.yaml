        body: "AAR-19 complete. First Sogni API video render executed, QA-passed, and durably stored.\n\nRender: Seedance 2.5 (Creative Agent selector seedance2-5; API model id seedance-2-5), text-to-video with native audio, 5s @ 720p (1280x720, 24fps, h264 + AAC).\nWorkflow: wf_durable_workflow_96549bad-a72c-48dd-bb1c-dec23bb0e1e9 — status completed. Submitted with confirm_cost=true; idempotency key persisted so a retry could not double-bill.\nCost: live estimate recorded pre-submission 300.456 Spark ($1.50228) via the socket.sogni.ai job-video estimate endpoint (seedance-2-5, 1280x720, 121 frames, 24fps); actual billed 300.456 Spark ($1.50228) — exact match. Pre-flight premium Spark balance 394.997 covered the quote. Settlement tx 1790062072466-0 (etherlink, spark).\nPre-flight balance: 919.997 Spark settled / 394.997 premium (GET /v4/account/balance, HTTP 200).\n\nDurable asset (outside the 48h signed vendor URL):\n- aarohi_seedance25_5s_720p.mp4 — attachment 8861ad08-89ab-400e-80d1-2a020ae5bb3d (5,118,940 bytes; sha256 aab4487573c63a6a68bbf25bd31c946e7cf4da221bdf7858a9ccb2783d1907e5; re-downloaded from the board and byte-verified)\n- AAR19_QA_RENDER_REPORT.json — attachment 60889541-7964-4d9d-870f-0b5fdc0d64d4 (full render + QA + pre-flight evidence)\n- Local durable copy: /root/.hermes/profiles/ai_visual_producer/cache/scratch/aar19/aarohi_seedance25_5s_720p.mp4 (scratch prunes after ~72h; the two board attachments above are the durable copies)\n\nQA (frames n=10/60/110 + ffprobe + volumedetect):\n- Brief match PASS — golden retriever puppy, bubble lands on nose and pops with sparkle droplets, sunlit living room, warm window light, shallow DOF\n- Embedded text/watermarks: none in any frame (clean-image standard) PASS\n- Anatomy/artifacts: none visible; identity continuous across frames PASS\n- Native audio PASS — AAC stereo 32 kHz, max -11.1 dB, mean -39.1 dB (real content, not silence)\n- Container PASS — 5.06s, 24 fps, h264 High yuv420p\nNote: mechanical self-QA only per the visual-asset-disclosure-qa skill — identity/safety judgment for a published asset requires the second-party review gate. This is a single-name capability test, not scheduled for publication.\n\nCredential handling: SOGNI_API_KEY from the parent task was moved into the managed profile .env (mode 0600) and used only via env/header injection; it never appears in comments, files, commands, or logs. Local copies of the parent description were sanitized."
