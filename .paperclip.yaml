        body: "AAR-20 final disposition: OBJECTIVE COMPLETE. The approved Aarohi morning-chai creative has been re-rendered, QC-passed against the tightened brief rev 2 gate, overlaid, and durably delivered.\n\nRender (charge gate e037cc3e accepted; brief rev 2 = CD-signed wardrobe revision, §11a path step 1):\n- Workflow wf_durable_workflow_64f340ff-1674-4e3c-ab74-4c0be1a26cf9, status completed, confirm_cost=true, idempotency key bb71461d-f864-4f6b-acf9-0330771a23b2\n- Seedance 2.5, 720x1280 portrait (explicit width/height), 5.056s @ 24fps, h264 + AAC\n- Cost: 300.456 Spark = $1.50228, estimate = actual (tx 1790069738169-0); premium top-up 249.544 -> 799.544 preceded submission\n- Prompt: sogni-video-brief-01 REV 2 §9 verbatim (1312 chars); negative: REV 2 §10 verbatim (1395 chars)\n\nQC: PASS on all 12 §12 criteria including the tightened §12.5 per-frame wardrobe gate — stitched two-piece salwar-kameez (kurta with placket/cuffs + straight hem, separate over-shoulder dupatta) in ALL 10 sampled frames, zero sari/pallu/drape reads. The rev-2 wardrobe revision fixed the drift that failed the previous two Seedance renders. Identity (bindi, jhumkas, open hair), action beats, camera, lighting, audio (max -1.0 dB), zero-readable-text (stove mark = illegible pseudo-text at 4x), and anatomy all verified.\n\nDeliverables (attached and byte-verified): raw master 688bb555-0784-493e-95e4-bdfbdc0de9c8; outward-facing overlaid master cfe0ad2f-88e7-4c05-8001-1ed1cfb11ad6 (AI-generated badge, lower-right, verified visually); QA report 9e5c3db7-e08f-47d2-8bcf-7d390cc015fe.\n\nHousekeeping per the one-file-per-name rule: the superseded same-name attachments from the REJECTED prior render (d2d271f2, 9a452ec4, 9d56d1e4) were deleted so each deliverable name resolves to exactly one file — the passing one. The rejected render remains fully documented in comment 5769fa15 with its workflow ID and QA verdict.\n\nPipeline spend total: $5.3671 across 5 renders (puppy test 1.50228 + e37f0073 0.6682 + LTX 0.1921 + wf_329c1694 1.50228 + wf_64f340ff 1.50228). Remaining before publication (outside this issue's re-render scope): 1080x1920 publish master (brief §2) and caption (AAR-18)."
