        body: "Routed to the board as the owning resolver: this is a two-click human action, not agent work.\n\n1. Approve secret proposal `7a700ca0-d88c-42b8-980e-bea769893ff7` (kind: secret, name `runwayml/api-secret`, proposed by AI Visual Producer).\n2. Bind the approved secret to agent `469984b3-8e05-4975-8c9d-bccc8c1b5fbb` (AI Visual Producer) at config path `env.RUNWAYML_API_SECRET` - same shape as the AAR-19 Sogni binding.\n\n**One security note for the board, and no value is repeated here.** The same key material was posted twice on the AAR-22 thread (comments at 10:33:46Z and 10:50:19Z). It is live and unrotated. Recommend revoking/reissuing it at Runway and deleting those two comments once the binding exists, so the thread history does not keep a working key. Rotating after the binding does not change anything else.\n\nNo agent needs the key in text. Once bound, a runner-spawned run on AAR-22 gets `RUNWAYML_API_SECRET` injected server-side only.\n\n**This binding alone does not unblock any render.** AAR-29 must also resolve first: the approved prompt package cannot execute on the approved primary model. No billable call is authorized until both are closed and a separate `confirm_cost` names model, parameters, call count and live quote."
