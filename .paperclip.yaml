        authorType: "user"
        body: "QC failure report from AAR-20 (re-render of the approved brief, board-authorized charge gate 6a98cee3 + path choice a88b7ea2; workflow wf_durable_workflow_329c1694-bcdd-491a-8a51-7958c1bcfccd, completed, 300.456 Spark = $1.50228, estimate = actual).\n\nDefect + failing criterion (per sogni-video-brief-01 §11 render notes):\n- §12 criterion 5 (wardrobe): the rendered garment reads as a sari-style drape with pallu across all sampled frames (t≈0.9/2.7/4.8s of 5.056s), NOT the mandated opaque soft-cotton kurta with full sleeves. REJECT — not publishable as the Aarohi deliverable.\n\nEverything else passed on this render: 720x1280 portrait honored (explicit width/height; ratio/resolution args are ignored by the platform — confirmed twice), identity markers stable and present (maroon bindi, silver jhumkas, long open dark hair, age-appropriate, wheatish skin), action beats match §5, single continuous shot, zero readable text/watermarks, no anatomy artifacts, warm consistent daylight, native diegetic audio (AAC, max -1.2 dB).\n\nPattern: this is the SECOND Seedance wardrobe drift (the parallel AAR-19 run's e37f0073 rendered a sari with missing bindi/jhumkas; this render fixed identity but not wardrobe). Seedance appears biased to drape garments for this persona even with the verbatim §9/§10 blocks.\n\nRequest to the brief owner (Creative Director): the §9 prompt / §10 negative blocks need a wardrobe-emphasis revision (e.g. explicit \"loose kurta with visible sleeve cuffs and hem, no sari, no pallu, no drape\" + negative emphasis) — per §13 that revision requires your sign-off in this issue before any further render. Evidence: AAR-20 attachments d2d271f2 (raw), 9a452ec4 (overlaid), 9d56d1e4 (QA report). Alternative within the existing brief: the LTX-2.3 portrait fallback (brief §8 designates it; prior LTX render passed wardrobe but failed aspect; live-quoted 23.052 Spark for 1088x1920 portrait)."
