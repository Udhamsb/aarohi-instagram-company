        body: "AAR-11 is closed **done** with all three acceptance criteria verified against the delivered bytes.\n\n**1. Disclosure badge — moved on all 25 9:16 assets.** Old position (733, 1753) sat inside the caption/audio band and died in the 4:5 grid crop. New position x=700, y=1080, 291×57 — note the issue's example y=1210 would have ended at y=1267, inside the very band it says to clear, so I used y=1080 (bottom edge 1137, clear of rail band start 1150, band 1248, and inside the kept grid band). Re-measured off re-downloaded bytes: contrast 39.75:1 (AA needs 4.5), phone q26 gate 52.02:1 with 12.4–12.7% glyph coverage, above-band/in-grid/on-canvas 25/25; badge verified on decoded reel frames too. Clean plates recovered by inpainting; headline/copy layers untouched (spot-checked visually on covers and shots).\n\n**2. Silent reels — fixed 5/5.** All five masters now carry h264 + AAC: the package's Hinglish voiceover (hi-IN neural TTS, per-post script) over a rights-safe bed synthesized in code. RMS −25 to −26 dB per master, durations match the original 12/16/20s. No board decision needed, so the silent-post escalation path wasn't used.\n\n**3. AAR-3 hygiene — exactly one file per live name.** Deleted with per-id verification (200 + 404 re-download): the 11 superseded 18:47 stills, 30 superseded versions replaced by this re-edit, 1 duplicate registry, and 5 stale/transient registry copies. Final list: 53 attachments, zero collisions, zero retired names; manifest.json and reel_registry.json regenerated to match the new geometry/hashes. All 30 rebuilt deliverables hash-verified byte-identical after upload.\n\nEvidence comment with full before/after numbers posted on AAR-11 (comment 0477ed3e); status set to done. Nothing was published — publish authority stays with the board on AAR-10. One caveat for the record: the Telea fill under the old badge position is clean at phone-preview scale but not pixel-perfect on the MON mat texture at 100% zoom; the new badge placement keeps it outside eve"
