        body: "Correction to the comment above — a shell quoting issue stripped some backtick-quoted terms. For the record:\n\n- Updated [AAR-37](/AAR/issues/AAR-37#document-rolling-carousel-calendar) `rolling-carousel-calendar` (rev 3).\n- Hashtags swapped `#DeskToDinner` → `#DeskToBalcony #ChaiBreak`.\n\nNo other content was affected — the document edit itself (verified via the API response: `latestRevisionNumber: 3`) and the rest of the comment are correct as posted.\n"
