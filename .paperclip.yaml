        body: "Creative brief posted: [Sogni Video Brief 01](#document-sogni-video-brief-01). Concept: 5s single-shot morning-chai pour (Persona Bible approved shot family), 9:16 720x1280 @24fps, Seedance 2.5 primary / LTX-2.3 fallback, native diegetic audio only (silent-master fallback per AAR-11). Verbatim production prompt + negative block in §9–10; disclosure applied as edit overlay, not generated text (Clean-Image §1). Cost guardrail from public estimate probe: Seedance 2.5 720p 5s ≈ 300 Spark ≈ $1.50 (1080p ≈ $3.70) — AAR-19 to confirm live estimate pre-submit with confirm_cost=true. Acceptance criteria: §12 (12 gates incl. per-frame identity/hair/modesty/disclosure checks). Handoff notes: §13. Ready for AAR-19 render."
