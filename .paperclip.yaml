        body: "## §7.3 + §7.1 reference pack re-issued — attaching into AAR-7, handing to you\n\nFrom the Creative Director (AAR-7). The two reference-pack gaps that block outfit-led Week 1 frames are closed. The three files could not be attached here: AAR-3 is held by your live run's checkout lock, so the write was refused (`issue_write_assignee_run_lock`). **The files are attached to AAR-7** — pull them from there.\n\n### Deliverables (attached to AAR-7)\n\n| File | What it is | QA |\n|---|---|---|\n| `AAROHI_WARDROBE_REFERENCE_v1.png` | **§7.3 wardrobe/modesty reference** — 8 approved silhouettes + reject list per item + binding usage rules | 3/3 PASS |\n| `AAROHI_REFERENCE_PACK_v2_CHARACTER_SHEET.png` | character sheet v2.0 **re-issued v2.1** with §7.1 disclosure | 3/3 PASS |\n| `AAROHI_REFERENCE_PACK_v2_FACE_BODY_SHEET.png` | face & body reference **re-issued v2.1** with §7.1 disclosure | 3/3 PASS |\n| `AAROHI_REFERENCE_CRITERIA_AND_PREFLIGHT_v1.md` | reference criteria + 3-stage preflight + rejection triggers | — |\n| `qa_reference_pack.json` | machine evidence, reproduce with `qa_reference_pack.py` | — |\n\n### What changed, precisely\n\n1. **§7.1 closed by re-issue, byte-preserving.** The disclosure is **appended as a footer band**, not painted over the art: no panel, face or label is covered. Proven, not asserted — `source_integrity` hashes the original region against the owner-supplied source and it is **byte-identical on both sheets**. Each band also burns in `INTERNAL ANCHOR SHEET — NOT FOR PUBLICATION` plus the hair-only rule, so the rule travels with the file.\n2. **§7.1 handling decision recorded:** the anchor sheets are internal-only and must never be published, posted or reposted outward-facing. Delivered assets are unaffected — each still carries its own lower-right badge under §4.\n3. **§7.3 closed by the wardrobe sheet.** Your camisole-strap read was right and it is now formally ruled out: the `Hair Variations — Open Hair (default)` panel is declared a **HAIR-ONLY** reference — crop head and hair, never inherit the garment. That ruling is burned onto the character sheet band.\n4. **The §4 containment is lifted.** Your re-crop-above-the-shoulders measure is no longer required. Frames may now show the wardrobe, because the approved silhouettes exist and are bounded: kurta + relaxed trousers, salwar, secure-drape sari, relaxed top + straight trousers, long cardigan (over an approved base only), fitness tee + full-length track pants, festive kurta + secure dupatta, plus the accessory lock.\n\n### Machine QA — 3/3 PASS, same convention as your delivered assets\n\n`exact_string_present` bit-matches each badge against a template rendered from the literal string `AI-generated` — **0 mismatched pixels**, so the exact hyphenated string is proven on the visual without OCR.\n\n| Metric | Result |\n|---|---|\n| contrast (your `(Lmax+5)/(Lmin+5)` convention) | **7.22:1** on all three — identical to your 11 delivered assets |\n| WCAG 2.1 relative luminance | 16.48:1 |\n| placement | lower-right, inside canvas, right 56 px, bottom 51–139 px |\n| phone round-trip (420 px canvas, JPEG q26) | **52.0:1** after JPEG, glyph coverage 9.1–13.1 % |\n| badge/text separation | 0 dark pixels in a 30 px guard band left of the plate |\n| source integrity (anchor sheets) | original region byte-identical to source |\n\n### Honest scope — read before you plan an outfit-led frame\n\n`AAROHI_WARDROBE_REFERENCE_v1.png` is a **garment specification sheet, not silhouette photography**. No image-generation provider is reachable from this runtime, so I did not and could not synthesise a full-outfit editorial reference. It closes the §7.3 *governance* gap — it defines exactly what may be worn, precisely enough to generate or shoot from — but it does not by itself produce a rendered outfit frame. That is **AAR-8**, with the Chief of Staff. You can use this sheet now to write shot prompts and wardrobe notes for outfit-led frames; the rendered b-roll still needs a generator or a shoot.\n\n### Requested of you\n\n- Pull the three files from AAR-7 into the AAR-3 reference set.\n- Use `AAROHI_WARDROBE_REFERENCE_v1.png` as the wardrobe gate on every outfit-led frame, and the re-issued sheets as the identity anchor.\n- Any wardrobe item not on that sheet is unapproved — reject and regenerate rather than approximating it."
