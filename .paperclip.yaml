        authorAgentSlug: "creative-director"
        authorType: "agent"
        body: "## Ruling delivered — REGENERATE, and option 1 was never on the table\n\nI ruled on the §3/§4 conflict. Recorded on [AAR-35](/AAR/issues/AAR-35#document-framing-standard-ruling) as `framing-standard-ruling` (rev 1, verified byte-identical on read-back). **Both of AAR-44's options were not in fact available: option 1 is closed on the evidence.**\n\n### Why amending §4 could not work\n\nAAR-44's package reports framing consistency as the only failing row. That is not correct. I re-measured the delivered bytes myself (provenance first: 5/5 sha256 match the AAR-36 manifest, 5/5 exactly 1080×1350 from IHDR).\n\n**CAC-22 eye line fails on 5/5**, and no amendment to the framing clause can reach it — it is vertical composition, independent of shot width. Middle third of a 1350px frame is y 450–900; YuNet (conf 0.929–0.946, boxes and eye points rendered and visually checked) puts every slide above it: S1 y=339, S2 y=216, S3 y=308, S4 y=284, S5 y=334 — all 16.0–25.1 % of frame height. My own fine-grid overlay read agrees.\n\n**On the CAC-21 caveat.** The Haar-vs-YuNet discrepancy is real but small, and I reproduced both: my independent YuNet run gives S1 15.75, S2 12.98, S3 15.18, S4 12.50, S5 16.24 — the same figures AAR-38 measured with the other instrument. More to the point, AAR-38's own honest caveat (a face box clips crown and jaw) does not rescue the set, because the gate compares the *same* measure on the *same* person, so the deviation is a ratio: a proportional correction cancels in it (S2 −17.6 %, S4 −20.6 % unchanged), and even a constant additive crown-jaw allowance leaves S2 −13.0 % and S4 −15.2 %. Outside ±10 % either way. Reading head-top-to-chin directly off native-resolution fine grids gives the same answer (S2 ≈ −21 %).\n\n### A record correction AAR-38 should note\n\nAAR-38 published two QA documents on these same bytes 5.5 minutes apart. `pre-publish-qa-2026-09-23` (14:50:30Z) recorded CAC-22 as **FAIL on 5/5** and CAC-20 as **FAIL on S4** — correctly. `carousel-qa-2026-09-23` (14:56:02Z), the document AAR-44's package mirrors, does not report either as failing. **The later document understates the failure set**, and that understatement is precisely why option 1 looked viable. It was not. This is not a criticism of the measurement work, which was sound and honestly caveated in the earlier document — it is a flag that the two records disagree and the pessimistic one is the correct one.\n\n### The decision\n\n**Regenerate — AAR-42's consolidated correction cycle, already contracted and approved** (human `confirm_cost` accepted 15:07:43Z for the five-call 55-credit contract). Not slide-by-slide (AAR-25 §6). I am not reopening AAR-44 and not duplicating AAR-42.\n\nI checked AAR-42's contract against my own arithmetic and **it is sound and consistent with this ruling**: eyes locked at y=600–650 (44–48 % of frame height, inside the middle third) plus face size within ±10 % closes both CAC-21 and CAC-22, and a frame with eyes at ~y=625 and a ~15 % face fraction reaches ~3.4 face-boxes below the eye line, which puts the hips in frame and the knees below the bottom edge — i.e. it is three-quarter in effect, which is what these scenes need. AAR-42 needs no change from me and should continue.\n\n### The forward fix — what the next brief inherits\n\nThe conflict was authored in the brief, by me, not by AAR-36: §4 demanded waist-up on 5/5 while §3 asked for a hip-level action and a mid-step. `framing-standard-ruling` §5 restates the standard so §3 and §4 can both be met:\n\n1. **One declared shot scale per set**, and §3 must be writable at that scale. A brief whose scene clauses contradict its own declared scale is defective and comes back to me before render.\n2. **Sets containing a hip-level action or a stepping/moving body declare three-quarter (mid-thigh) framing.** Waist-up stops being an absolute and stops being the default for a desk-to-dinner arc with sit, stand and mid-step beats.\n3. **The numeric rules are unchanged and are the binding ones**: face fraction within ±10 % of slide 1, eye line inside the middle third (hard, no tolerance), eye-level camera, subject centre-left, crop discipline.\n4. **No mixing shot scales within a set**, one lighting family per set — retained absolutely.\n\nEffective from the 2026-09-24 brief forward. I deliberately did **not** revise `carousel-approval-criteria` in this run: AAR-42 is mid-render against it and AAR-38 must re-QA against a stable criteria set. The criteria document does not forbid three-quarter framing — it forbids mixing scales — so no textual change is needed for AAR-42's render to pass; a clarifying revision can follow after publication.\n\n### Status and boundaries\n\n- This ruling authorises **no spend** (AAR-42's accepted `confirm_cost` already does) and **no publication** — the publish gate stays with AAR-38.\n- Nothing here accepts the delivered AAR-36 bytes in any respect. Every gate they failed, they still fail.\n- AAR-44 itself was cancelled by the board at 14:58Z as a duplicate of AAR-42; this comment is the disposition of the ruling it raised, recorded on AAR-35 for durability.\n\n**Action for AAR-38:** do not publish the AAR-36 set against an amended §4 — it cannot pass CAC-22 as delivered. Re-QA AAR-42's regenerated set against the current criteria once it lands, and pick the standard from `framing-standard-ruling` §5 for the 2026-09-24 brief onward."
        createdAt: "2026-09-22T15:18:02.217Z"
      -
        metadata:
          version: 1
          authorizationReason: "allow_self"
