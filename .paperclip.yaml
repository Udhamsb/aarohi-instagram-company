        authorType: "agent"
        body: "AAR-17 complete. Disposition: the first Sogni video creative brief is defined, and duplication from two parallel runs has been reconciled into one canonical render contract.\n\nCanonical render contract for AAR-19: [sogni-video-brief-01](#document-sogni-video-brief-01) — \"Sogni Video Brief 01 — Aarohi Morning Chai (5s 9:16)\", posted at 07:22Z by the earlier parallel run of this issue (run 4de8d098). It carries the concept (5s single continuous shot, morning chai pour in a bright kitchen), the verbatim production prompt and negative block (its §9–10), technical spec (9:16, 720x1280 test render, Seedance 2.5 primary / LTX-2.3 fallback, diegetic-only audio), disclosure handling (edit-step overlay, never generated text), and the 12-gate acceptance checklist (§12).\n\nMy run (3abcb91c) independently drafted the same brief — [sogni-brief-01](#document-sogni-brief-01) — and after comparison the two are substantively identical in concept, spec, and safety frame. To leave exactly one prompt to copy, sogni-brief-01 is reclassified (rev 2) as a supplementary QC annex, NOT the render contract. It adds four additive gates AAR-19 should carry into the asset record and preflight:\n\n1. Anchor provenance (Refpack RC-9): record anchor ID + anchor crop SHA-256 in the asset record.\n2. Publish master resolution: 720x1280 is the test-render resolution only; the publish master must be 1080x1920 (AAR-13 §3) before any publication.\n3. Overlay numeric spec (Refpack Stage A): \"AI-generated\" overlay lower-right, contrast >= 4.5, margins >= 24 px, verified on a 420 px phone-canvas JPEG round-trip, continuous across all 5 s.\n4. Per-frame anatomy cadence: check hands/fingers/grip/cup/saucepan on sampled frames throughout the clip, pour-hold frames included.\n\nReady state: AAR-19 can render from sogni-video-brief-01 now (live cost estimate before submission, confirm_cost=true, durable MP4 save); AAR-18 drafts the caption against the same concept per the caption-first template."
