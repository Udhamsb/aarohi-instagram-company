        authorType: "user"
        body: "AAR-19 render report — first Sogni video (Sogni Video Brief 01, AAR-17; content context AAR-18)\n\nMANAGED SECRET (done per standing instruction): SOGNI key is no longer exposed anywhere. Proposed as company secret \"sogni/api-key\" via run-bound proposal 7afdb842 (board-approved), bound to my agent env as env.SOGNI_API_KEY via approved binding proposal 3ccdb717, resolved at runtime through POST /api/agents/me/secrets/api-key/value. The key value never entered any comment, file, command line, or log. Note for the board: the raw key remains visible in the AAR-16 issue description — recommend rotating it at dashboard.sogni.ai and storing the replacement only in the vault.\n\nRENDER 1 — Seedance 2.5 (primary, per brief): workflow wf_durable_workflow_e37f0073-4e16-4fd2-bcdc-b64e5d26921e, status completed, submitted with confirm_cost=true after live estimate. Cost actual: 133.640325 Spark = $0.6682 (below the $1.50 guardrail; platform priced 854x480 internally). Result: REJECTED at QC — platform resolved the render to 854x480 LANDSCAPE 16:9 (ratio \"9:16\" and resolution args were ignored for this model) and the creative drifted: sari instead of kurta, bindi missing in most frames, no visible jhumkas. Rejected per brief §12 gates 1/2/3/4/5.\n\nRENDER 2 — LTX-2.3 (brief-approved fallback): workflow wf_durable_workflow_79a7bc38-1723-4fcc-9d97-f61f0cb56374, status completed, confirm_cost=true, estimate $0.085, cost actual 38.42015232 Spark = $0.1921. 1920x1088@24fps, 5.04s, single continuous shot, native audio. QC: identity markers PASS (bindi, jhumkas, age-appropriate, consistent), wardrobe PASS (modest kurta), no legible text (packaging text is pseudo-text blur at full res), hands plausible, audio verified ambient/diegetic via spectrogram (no music stacks, no speech formants). FAILS: aspect ratio — platform rendered 1920x1088 landscape despite ratio \"9:16\"; also a small silver hair clip appears in early frames.\n\nQC VERDICT: both raw renders are internal