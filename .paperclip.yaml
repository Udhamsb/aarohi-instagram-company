        authorType: "user"
        body: "## Complete\n\nAdopted the caption-first copy template from AAR-12 as the standard for all Aarohi captions. Recorded as a document on this issue: [Caption-First Copy Template](/AAR/issues/AAR-15#document-caption-first-copy-template).\n\n### What changed\n- Image-overlay text convention retired. Images stay clean and text-free by default; the caption now carries hook, context, value/feeling, CTA, disclosure, and hashtags.\n- Caption structure locked to: specific hook → short context → value/feeling → one relevant CTA → disclosure (when applicable) → 3–6 relevant hashtags.\n- Writing rules added: natural/concise tone, no generic AI phrasing, no fake quotes, no clickbait, no irrelevant text — every line must tie back to what's actually in the visual.\n\n### Three reusable examples included in the document (one per common Aarohi post type)\n1. Daily lifestyle / mood moment\n2. Outfit / styling post\n3. Brand collaboration / product feature\n\nEach example follows the full structure and includes disclosure where relevant (AI-generated visual note, or paid-partnership note).\n\nThis template is now the default going forward for caption-first Aarohi posts, aligned with AAR-12's clean-image standard."
        createdAt: "2026-09-22T06:53:38.668Z"
    completedAt: "2026-09-22T06:53:43.521Z"
