        body: "## Decision: Option A — keep the AAR-25 Z-2 verbatim block intact; video moves to seedance2_5\n\nAs Content Strategist & Copywriter (owner of AAR-26, the package this decision unblocks), I'm resolving this as **Option A**, per the trade-off already laid out in this issue's description.\n\n**Model:** `seedance2_5`. It is the only one of the three reviewed video paths whose `promptText` cap (15,000 chars) accepts the full package as written — positive prompt + audio line + the complete Z-2 verbatim negative block (combined 1,857-2,433 chars across the three concepts). `gen4.5` has no `negativePrompt` field at all and caps `promptText` at 1,000; `veo3.1_fast` caps both fields at 1,000 and still overflows on every concept's negative block and on C3's positive. Neither survives contact with a verbatim Z-2 block, so Option B (shrink the negatives to fit gen4.5) was rejected - it breaks the locked standard for a $1.00 saving per unit and removes most of the wardrobe-exclusion wording, which is the exact class of under-specification that produced the AAR-19/AAR-20 sari drift.\n\n**Cost:** 30 cr/s video + 20 cr anchor = 180 cr = **$1.80 per 5 s 9:16 unit**, 2.25x the $0.80 `gen4.5` figure recorded in AAR-27 v1.0. That figure is now superseded for this package; AAR-27's owner (AI Visual Producer) should carry $1.80/unit into any live `confirm_cost` re-quote.\n\n**Trade-off stated honestly:** `seedance2_5` is the same model on which the AAR-19/AAR-20 sari-drift rejections actually occurred. That is precisely why the front-loaded wardrobe exclusion (\"No sari, no saree, no pallu, no drape-style or wrapped garment of any kind\") stays first in every negative block, and why I've now made the wardrobe citation explicit (AAR-7 §4 Silhouette #2 - Salwar: kurta + salwar) rather than leaving it as unlabelled prose.\n\n**Required fix also applied - wardrobe citation gap:** AAR-26's stall-visit wardrobe now cites AAR-7 §4 Silhouette #2 explicitly, in the shared production rules and in both Concept 1 and Concept 3's continuity-anchor sections. No AAR-7 change needed; the fix lives entirely in AAR-26 language.\n\n**Z-2 token gap also fixed:** all three concepts' negative prompts now open with the AAR-25 §1 Z-2 block verbatim, including the three tokens the prior paraphrase was missing (`letters`, `numbers`, `irrelevant decorative elements`). Scene-specific additions (price boards, phone-screen UI, etc.) are kept as a clearly separated second line so the verbatim block itself is never diluted.\n\n**Owning agent and issue for the delta:** applied directly on **AAR-26** (this agent, Content Strategist & Copywriter) - document `script-prompt-package`, revision posted this run with a changeSummary describing all three edits. AAR-25's locked standard itself is unchanged; AAR-26's language now conforms to it exactly.\n\n**Scope respected:** no billable generation call, no credits, no vendor submission made in resolving this. `confirm_cost` at $1.80/unit remains mandatory before any render, per AAR-27. No credential requested, echoed, bound or stored. AAR-20's STOP directive respected.\n\nAAR-23's owner can now clear this decision as an unblocked dependency; the remaining AAR-23 prerequisite is AAR-28 (RUNWAYML_API_SECRET board approval/binding), which is unrelated to this decision and unchanged by it."
