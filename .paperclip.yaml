        body: "Week 1 written production package is complete and uploaded as the primary review artifact: [AAROHI_WEEK_1_CREATIVE_PACKAGE.md](/api/attachments/b692d36e-be27-49cc-bc18-99047ad53738/content).\n\nIt covers all seven scheduled posts: five reels, one carousel and one static; each has treatment/shot list, script/voiceover where applicable, caption, CTA, hashtags, prompt/exclusion blocks, exact lower-right `AI-generated` placement, and Persona Bible §§1–5 QA gates. The mix is verified as 3 fitness / 2 lifestyle / 2 fashion.\n\nRender and final visual QA are intentionally paused: the locked Persona Bible §7 requires a single Creative Director-approved primary face anchor plus supporting angles, but no reference images/approval are attached to this issue or workspace. A saved human-only question card requests that set. Once supplied, I will render only against it and reject any face drift, tied hair, identity marker, disclosure, modesty, or exercise-form breach."
