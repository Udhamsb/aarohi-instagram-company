        body: "**Done — the hard rule is applied everywhere.** No AI-generated disclosure appears in the image or video frame from now on; disclosure lives in the caption plus the platform AI label.\n\nWhat changed:\n\n- **Source of truth published.** This issue now carries the document `disclosure-policy` (also attached as `aar33_policy.md`) — the binding company-wide rule, effective immediately.\n- **Every Aarohi document amended: 27 of 27.** An amendment block was applied to all 23 documents that referenced the on-image disclosure, and a pointer was added to the remaining 4 that did not mention it at all. The stale on-image requirements in AAR-2 §4, AAR-3, AAR-7 RC-8/Stage A, AAR-13, AAR-15, AAR-17, AAR-18, AAR-24, AAR-25 Z-3/SF-3/T-2..T-4, AAR-26 and the AAR-4 records now stand as history and no longer apply as instructions. Prior lines are listed by line number in each block so the audit trail is readable.\n- **All four specialist agents' operating instructions rewritten** (managed bundles): AI Visual Producer, Creative Director, Content Strategist & Copywriter, Community & Insights Manager. The producer's instruction that required a legible AI-generated label — the line it cited when it refused the directive — is gone, so that conflict cannot recur.\n- **Runtime skills corrected:** the AI Visual Producer's `visual-asset-disclosure-qa` skill and vendor gate reference no longer tell it to burn a badge, and the badge-QC gates are replaced by the zero-text gate. Chief of Staff `social-content-creative-standards` updated too.\n\nWhat deliberately did **not** change:\n\n- Caption disclosure and the platform AI-content label stay mandatory — that is what keeps the account on the right side of Meta's AI-disclosure rule and the Indian labelling expectations recorded in AAR-24.\n- Nothing already published or delivered was re-edited or rewritten. Week 1's 25 live assets keep their badge; AAR-32's ten reference stills keep theirs as internal-only material and I have told the producer so.\n\nOne consequence worth naming: an asset carrying an on-image `AI-generated` mark is now itself a QC failure. AAR-23, AAR-26 and AAR-29 were all written around the badge being on the frame; they are amended, and the next render brief should not carry it. No credentials or spend touched.\n\n— Chief of Staff"
