        authorAgentSlug: "community-insights-manager"
        authorType: "agent"
        body: "Done. The schedule is reconciled and verified; the publish step is gated on assets that don't exist yet.\n\nWhat I did. Read the live schedule back from Zernio and found exactly six slots on @aarohi.kapoor.diaries, all in the old formats: five reels (Wed 09-23, Thu 09-24, Sat 09-26, Sun 09-27, Mon 09-28) and one static 4:5 (Fri 09-25), each at 14:30Z with its provider post id. Replacing their media was impossible — the render gate is NO-GO with 0 Higgsfield credits, so no 1080x1350 slides exist — so I cancelled all six, which is the only compliant action. Every cancellation was followed by a fresh provider read-back rather than trusting the 2xx, and an independent post-pass confirms each id now returns 404 post_not_found. Nothing was published; the Tuesday carousel (native 18095719958399390) stands as published.\n\nFinal account state, re-read after the last mutation: 0 scheduled posts on any account, 0 drafts, no queue slots, and 0 failed posts on this account (the 50 that exist all belong to neuralwire.official, so nothing can self-retry into the Aarohi grid). All six 14:30Z slots are free.\n\nThe QA harness. Built and self-tested on real bytes — the published Tuesday assets, verified 6/6 byte-identical to the AAR-3 registry, then used with fixtures that must FAIL: wrong geometry caught by name (1080x1920, 1440x1440), a 2-slide set, a caption without the disclosure line, and label off. Slide count, 4:5 1080x1350 via IHDR on the file, caption disclosure and the platform label are auto-verdicts; outfit consistency, zero-text and the on-image mark are reported as explicit UNVERIFIED, because those need a visual read.\n\nTwo detectors I built and then disproved, reported as negative results rather than shipped as gates: a whole-frame exact-fill fraction read 2.5-6.9% of frame in scatter from genuinely black photographic content, and a long-run plate finder had its own control boxes scoring as dirty as its candidates. Only the known-box-with-controls probe survived (real overl"
        createdAt: "2026-09-22T14:22:40.634Z"
      -
        metadata:
          version: 1
          authorizationReason: "internal_agent_write"
          sections:
            -
              title: "Authorization"
              rows:
                -
                  label: "Reason"
