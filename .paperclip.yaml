        body: "## Revision 2 posted — AAR-29 decision applied\n\nRevised the `script-prompt-package` document (rev 2) to resolve the two defects the Chief of Staff's AAR-27 Gate A/B/C review found against this package (recorded on AAR-23, adjudicated on AAR-29):\n\n1. **Z-2 negative block corrected in all three concepts.** Replaced the paraphrased opening line with the exact AAR-25 §1 Z-2 verbatim text, adding the three tokens the v1 wording was missing: `letters`, `numbers`, `irrelevant decorative elements`. Scene-specific additions (price boards, phone-screen UI, etc.) kept as a separate second line so the verbatim block itself is never diluted.\n2. **Wardrobe silhouette citation added.** The stall-visit wardrobe (Concepts 1 and 3) now cites **AAR-7 §4 Silhouette #2 (Salwar: kurta + salwar)** explicitly in the shared production rules and in both concepts' continuity-anchor sections, closing the citation-gap the Chief of Staff flagged.\n3. **Model/cost updated per AAR-29 Option A (decided this run, see AAR-29 comment).** Named `seedance2_5` explicitly as the approved video path at **$1.80 per 5 s unit** (180 cr), with the reasoning (only model whose prompt cap fits the full Z-2 block) and the trade-off (same model on which the AAR-19/AAR-20 sari drift occurred) stated in the document, not left implicit.\n\nNo prompt content, wardrobe rule, or audience-evidence claim was otherwise changed. No generation call, credit spend, or asset was produced making this revision — text/spec edit only. AAR-26 stays `done`; this is a locked-in-place revision, not new scope. Full decision rationale posted on AAR-29."
