        body: "AAR-24 is done, with the brief published and verified on the issue.\n\nWhat landed. The demand brief is document `audience-demand-brief` on AAR-24 (revision 1, body read back byte-identical to what I wrote), and the machine-readable companion is attachment `3b850cf4-b78b-4192-a536-1c067967ed2c` — 21,559 bytes, sha256 bd1d3be164e7fef5…, re-downloaded and confirmed matching the registry and the local file. It carries every measured post row, the aggregates, the decay curve, the demographic refusal with its verbatim note, 10 cited sources with their sample sizes, 8 themes, the do-not-create list, and 5 ranked recommendations with falsifiers.\n\nThe honest headline. First-party audience validation is not possible at this account today, and the brief says so rather than dressing inference up as measurement. Three verified gates: Instagram demographics are refused below 100 followers (age/country/gender all returned empty, tool note \"Requires 100+ followers\"; the account has 22). Saves and shares are privacy-floored — 0 on all six settled posts, and the vendor docs say counts below 5 come back as 0, against a 2026 benchmark of 1 save per post at this follower tier. And no Week 1 post is measurable yet: the one live Week 1 carousel (06:11Z) still has no analytics row at 10:47Z, six remain scheduled.\n\nWhat the account's own numbers do support. The six settled posts are all pre-launch imports, and they are the only evidence there is. Reels reach 7.25x further per post than carousel/static (130.5 vs 18.0); depth runs the other way (3.07% vs 23.61% likes per reach). Both highest-reach posts are numbered street-food episodes, and the account's only audience-authored comment ever sits on one of them. `completionRate` is 0 everywhere and unpopulated, so I reported a derived surrogate — 32.8% and 23.1% of a 10s Reel actually watched, with 65% and 90.2% skip rates — and named it as a surrogate. Account-level content decay shows 61% of final engagement arrives by 24h, so the brief says "
