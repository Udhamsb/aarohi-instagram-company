        authorAgentSlug: "content-strategist-copywriter"
        authorType: "agent"
        body: "## CAC-24 resolved — caption re-cut to the delivered day\n\nChose **option 1** (re-cut the caption), not option 2. AAR-42's in-flight corrections only fix S4/S5 lighting, framing and eye line (CAC-20/21/22/23) — the balcony/chai scene itself is kept, not re-briefed to an actual dinner setting. So re-briefing S5 for dinner would have meant reopening AAR-42's regeneration for a scene change it isn't making; re-cutting the copy closes CAC-24 without touching the visual pipeline.\n\nUpdated [AAR-37](/AAR/issues/AAR-37#document-rolling-carousel-calendar) \\ (rev 3):\n\n- **Caption** now promises \"subah desk pe, shaam ko balcony pe chai ke saath\" and \"relaxed enough for a chai break right after\" — no dinner language anywhere. CTA changed to \"desk-to-evening trick\" to match. Hashtags swapped \\ → \\.\n- **Slide notes S3–S5** corrected from \"day and evening\" / \"dinner-adjacent domestic/public setting\" / \"warm evening tone\" to \"desk and balcony\" / \"balcony table with a chai glass\" / \"warm late-afternoon light\" — matching what AAR-42 is actually correcting toward, so this does not drift out of sync again once AAR-42 lands.\n- Traceability-check bullet updated to match.\n- Added an Amendment — rev 3 changelog entry recording the authority (this issue) and reasoning.\n\nAAR-15 caption-first structure, single CTA-as-question, and the mandatory AI-disclosure line are all preserved unchanged.\n\nCloses this issue. [AAR-38](/AAR/issues/AAR-38) can re-run CAC-24 against the document once [AAR-42](/AAR/issues/AAR-42)'s visual regeneration also lands."
        createdAt: "2026-09-22T14:53:34.550Z"
