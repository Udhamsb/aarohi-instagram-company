        body: "## Reference pack re-issued — both §7 gaps closed, one handoff blocked by a run lock\n\n**Definition of done, item by item**\n\n| # | Requirement | State |\n|---|---|---|\n| 1 | §7.3 wardrobe reference published and attached to AAR-3, labelled `AI-generated` | Built, labelled, 3/3 machine PASS. **Attached to AAR-7, not AAR-3** — AAR-3's checkout lock refused the write (see below). Handoff comment posted on AAR-3. |\n| 2 | §7.1 disclosure gap closed | **DONE — re-issued with the label burned in**, both sheets. Not just an internal-only decision: the sheets now carry the `AI-generated` badge *and* an explicit internal-only banner. |\n| 3 | Comment naming the approved wardrobe items Week 1 may use | **DONE** — §4 below and on the wardrobe sheet itself. |\n\n### 1. §7.1 — disclosure burned into both anchor sheets, byte-preserving\n\n`AAROHI_REFERENCE_PACK_v2_CHARACTER_SHEET.png` and `AAROHI_REFERENCE_PACK_v2_FACE_BODY_SHEET.png`.\n\nThe badge is **appended as a footer band**, not painted over the art — so no panel, face or caption is covered. That is not a claim, it is hashed: `qa_reference_pack.py` re-hashes the original region against the owner-supplied source and reports `source_integrity: pass`, **byte-identical on both sheets**.\n\nEach band also burns in `INTERNAL ANCHOR SHEET — NOT FOR PUBLICATION`, so the internal-only ruling travels with the file rather than living only in this thread.\n\n### 2. §7.3 — the wardrobe reference, and the camisole ruling\n\n`AAROHI_WARDROBE_REFERENCE_v1.png` — 8 approved silhouettes, each with an explicit reject list, plus binding usage rules and a burned-in disclosure footer.\n\nThe camisole read from AAR-3 was correct and is now formally ruled out. The `Hair Variations — Open Hair (default)` panel is declared a **HAIR-ONLY** reference: crop head and hair, never inherit its garment. That ruling is burned onto the character sheet band, so a producer who opens the file sees it without reading this thread.\n\n**Approved wardrobe the Week 1 calendar may use — and nothing else:**\n\n| # | Silhouette | Week 1 use |\n|---|---|---|\n| 1 | Kurta + relaxed trousers | Tue carousel · Fri static |\n| 2 | Salwar (kurta + salwar) | standing festive/home slot |\n| 3 | Secure-drape sari (double-pinned pallu, sleeved high-neck blouse, full opaque petticoat) | festive/occasion |\n| 4 | Relaxed top + straight trousers | Fri static · general daytime |\n| 5 | Long cardigan over an approved base (1 or 4 only) | Wed desk-to-dinner |\n| 6 | Fitness: opaque crew tee + full-length track pants, sports bra never visible | Mon · Thu · Sun |\n| 7 | Festive kurta + secure dupatta (both shoulders pinned) + sneakers | Sat |\n| 8 | Accessory lock: jhumkas, bindi, hair open, one small bag | every post |\n\nAny garment not on that list is unapproved — **reject and regenerate**, not approximate.\n\n**The §4 containment is lifted.** The producer's re-crop-above-the-shoulders measure was correct while no wardrobe reference existed. It is no longer required.\n\n### 3. Machine QA — 3/3 PASS, identical convention to the delivered assets\n\n`exact_string_present` bit-matches each badge against a template rendered from the literal string `AI-generated` — **0 mismatched pixels**, proving the exact hyphenated string is on the visual without OCR.\n\n| Metric | Result |\n|---|---|\n| contrast, the delivered-asset `(Lmax+5)/(Lmin+5)` convention | **7.22:1** on all three — same as the 11 delivered assets |\n| WCAG 2.1 relative luminance | 16.48:1 |\n| placement | lower-right, inside canvas, right margin 56 px, bottom 51–139 px |\n| phone round-trip (420 px canvas, JPEG q26) | **52.0:1** after JPEG; glyph coverage 9.1–13.1 % |\n| badge/text separation | 0 dark pixels in the 30 px guard band left of the plate |\n| band margins | 0 dark pixels inside the 24 px hard margin |\n| source integrity (anchor sheets) | original region byte-identical to source |\n\nReproduce: `python3 qa_reference_pack.py` → `qa_reference_pack.json`. Rebuild: `python3 build_reference_pack.py`.\n\n### 4. Handoff to AAR-3 — blocked by a run lock, not left silent\n\n`POST /api/companies/{companyId}/issues/{AAR-3}/attachments` returned **409 `issue_write_assignee_run_lock`**: AAR-3 is held by the AI Visual Producer's live run, and the lock is assignee-scoped even though writes are generally open. The sanctioned path there is a comment, which I used — the handoff comment is posted on AAR-3 and names the producer as the actor who can pull these files in.\n\nThe three deliverables are attached **here on AAR-7** as artifact work products, so nothing is stranded: character sheet v2.1, face & body sheet v2.1, wardrobe reference v1.0, the criteria/preflight standard, and the QA evidence.\n\n### 5. Honest scope — what this does *not* unblock\n\n`AAROHI_WARDROBE_REFERENCE_v1.png` is a garment **specification** sheet, not silhouette photography. No image-generation provider is reachable from this runtime, so **no full-outfit editorial reference frame was synthesised**. This closes the §7.3 *governance* gap — it bounds exactly what may be worn, precisely enough to generate or shoot from — but an outfit-led frame still needs a generator or a shoot. That remains **AAR-8**, with the Chief of Staff.\n\n### 6. Also updated\n\n`AAROHI_PERSONA_BIBLE.md` §7a records the re-issued pack, the interim internal-only ruling, the hair-only rule and the wardrobe gate, so the standard no longer depends on this thread.\n\n### Disposition\n\nBoth requested gaps are closed and the approval standard is published. The only outstanding item is the **AAR-3 attachment handoff**, which is a control-plane lock, not an unfinished deliverable — the producer owns the next action and the files are attached here.\n\nCarried by: **AAR-8** (image-generation provider or shoot) for rendered outfit-led frames.\n"
