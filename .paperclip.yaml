  aar-34:
    comments:
      -
        authorType: "user"
        body: "**Done — the plan change is live everywhere, and today's post is assigned out to the four owners.**\n\nThe rule is now: **one image carousel per day, one outfit per day.** 4–6 slides (default 5), every slide 4:5 1080×1350, and the same single outfit on every slide of that day's carousel, rotating day to day from the approved wardrobe list. Reels, videos and single statics are gone as daily formats.\n\nWhat changed, in all three places a rule has to live:\n\n- **Binding source of truth published.** This issue now carries `daily-format-standard` — the company-wide rule, with the pass/fail list. Effective immediately, supersedes every older reel/static daily plan.\n- **Every Aarohi document amended: 14 of 14.** A block was prepended to AAR-1, AAR-2, AAR-4 (publication record + publishing readiness), AAR-5, AAR-7, AAR-13, AAR-17 (both briefs), AAR-24, AAR-25 (production standard + preflight checklist), AAR-26 and AAR-29. Each block lists the superseded lines by number so the audit trail stays readable. The old reel scripts, 9:16 masters, silent-master and audio-stream requirements now stand as history, not as instructions.\n- **All five agent instruction bundles rewritten** — Creative Director, AI Visual Producer, Content Strategist & Copywriter, Community & Insights Manager, Chief of Staff. Read back and verified: each carries the carousel-only rule. No agent is left reading the reel-and-static mix.\n- **Runtime skills corrected** — each specialist's per-heartbeat skill, the publishing-calendar and pre-publish-QA references, the AI Visual Producer's disclosure/QA skill, the Chief of Staff creative standards, and the Creative Director's video-brief skill (now gated: no video brief for the daily plan without an explicit board re-authorisation).\n\nWork distributed — four child issues, one per accountable function, all executing now:\n\n- **AAR-35 — Creative Director.** Carousel approval criteria, the 7-day outfit rotation plan, and the brief for the next post with the one outfit named verbatim.\n- **AAR-36 — AI Visual Producer.** Pre-render gate and render contract first, then (on human cost approval) the 5 slides at 1080×1350, one outfit, text-free, with QA evidence.\n- **AAR-37 — Content Strategist & Copywriter.** The rolling one-carousel-per-day calendar replacing the reel/static one, plus the caption for the next post.\n- **AAR-38 — Community & Insights Manager.** Reconciles the live Instagram schedule, and QAs/publishes the first daily carousel.\n\nOne thing needs your attention, flagged rather than assumed away: **the six remaining Week 1 slots are still scheduled in the old formats** — five reels and one static 4:5, and the next one publishes 2026-09-23 14:30Z. Under the new rule none may publish as-is. AAR-38 is replacing or cancelling each one; the first real gate is whether that slot gets the new carousel in time.\n\nTwo things deliberately did not change: the disclosure rules (caption note + platform AI-content label stay mandatory; no on-image mark, ever) and the billable-render gate (render contract, live estimate, and your explicit cost approval before any paid call). Nothing has been spent, and the already-published Tuesday carousel is untouched.\n\nOne reading I had to fix to move: \"same outfit\" is applied as **one outfit per day, held across that day's slides, rotating daily**. If you meant the literally identical outfit on *every* day, that one line changes and nothing else moves.\n\n— Chief of Staff\n"
