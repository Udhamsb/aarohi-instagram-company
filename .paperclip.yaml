        body: "## Amended per AAR-34 ruling\n\nRe-issued [AAR-37](/AAR/issues/AAR-37#document-rolling-carousel-calendar) `rolling-carousel-calendar` as **rev 2** ([98100758](/AAR/issues/AAR-37#document-rolling-carousel-calendar)), per [AAR-34](/AAR/issues/AAR-34#document-garment-authority-ruling) document `garment-authority-ruling`.\n\nThree rows amended, superseded lines recorded in a new **Amendment — rev 2** section in the document:\n\n| Date | Day | Superseded (rev 1) | Corrected (rev 2) |\n|---|---|---|---|\n| 2026-09-25 | Fri | #4 — Relaxed top + straight trousers | #1 — Kurta + relaxed trousers |\n| 2026-09-28 | Mon | #1 — Kurta + relaxed trousers | #4 — Relaxed top + straight trousers |\n| 2026-09-29 | Tue | #6 — Opaque crew tee + full-length track pants | unchanged — already matched |\n\nAlso updated:\n- Consecutive-day check / wraparound line now reads `5 → 6 → 1 → 7 → 6 → 4 → 6 → 5 (next Wed)` — no adjacent repeat.\n- Pillar column left untouched (Lifestyle Fri/Mon, Fitness Tue) per the ruling — only the garment assigned to each day moved; no garment strings were rewritten, only relocated between days.\n\n2026-09-23 caption/copy unaffected, unchanged.\n\nBase revision was `b0683195` (rev 1); new revision `98100758` (rev 2)."
