        body: "## Runway Dev adoption — assessment delivered (no billable call made, no code scaffolded)\n\nWorkspace, docs, constraints, and pricing all verified; full record in the attached `AAR22_RUNWAY_ADOPTION_ASSESSMENT.md` (docs fetched live today from quickstart + llms.txt + ai-context.md + models.md + pricing.md + api.md + mcp.md).\n\n**Verified workspace:** the shared Onboarding checkout contains only the two installed Runway skills (`runway-dev`, `runway-dev-models`, from `runwayml/skills`, hashes pinned in skills-lock.json — both read) plus Aarohi campaign assets and utility scripts. There is NO app/integration target (no package.json, no server, no frontend, no generation client). Zero Sogni references remain in the workspace; the retired Sogni skill is already removed from my profile. No Sogni fallback anywhere.\n\n**Surface:** Runway Dev Models (direct generation) as directed — not Routers/Characters/Recipes. Endpoints: `POST /v1/text_to_image`, `POST /v1/image_to_video` (+`/v1/text_to_video` optional).\n\n**Account gate (verified live, read-only):** `RUNWAYML_API_SECRET` is NOT provisioned in this run's environment — probed without printing (shell env, gateway process environ). SDK/REST generation and the credit check are blocked until a human provisions it. Dev MCP `https://dev.runwayml.com/mcp` is reachable and OAuth-gated (initialize → 401 unauthorized); OAuth must be completed by a human in a normal browser — I did not and will not automate it, and no API key belongs in MCP config.\n\n**Selected models (constraints + pricing verified in current docs, not memory):**\n- Photo on `POST /v1/text_to_image`: `gen4_image` — 5 cr/720p, 8 cr/1080p image, prompt ≤1000, ratio required (incl. `1080:1440` 4:5), seed supported → default for clean campaign stills. `gen4_image_turbo` — 2 cr any res, but 1–3 reference images REQUIRED → identity-conditioned drafts from the Aarohi reference pack. `gemini_image3.1_flash` (Nano Banana 2) — best human-subject consistency (≤14 refs, up to 5 tagged `subject:\"human\"`), but its per-image price is NOT published in pricing.md → confirm live cost via MCP `list_models`/`get_credit_balance` before any use. Cheapest drafts: `muse_image`, 1 cr/image.\n- Video on `POST /v1/image_to_video`: `gen4.5` — 12 cr/s, ratio `1280:720`/`720:1280`, duration 2–10 s → hero shots. `gen4_turbo` — 5 cr/s → budget reels from approved stills. Retired identifiers `gen3a_turbo`/`gen4_aleph` now hard-fail; replaced by `gen4.5`/`gen4_turbo` and `aleph2`.\n- Credits are $0.01 each. Example unit costs for our formats: 4:5 1080p still = 8 cr ≈ $0.08; 5 s 720p reel on `gen4_turbo` = 25 cr ≈ $0.25; hero 5 s on `gen4.5` = 60 cr ≈ $0.60.\n\n**Recommendation — smallest useful integration (needs your product direction, not scaffolded):** a thin server-side generation service: one module (Python `runwayml` or Node `@runwayml/sdk`) behind a server boundary reading `RUNWAYML_API_SECRET` from server env only; `POST /api/generate {modality, prompt, ratio, duration, refs}` chaining the SDK wait helper (`wait_for_task_output()` / `waitForTaskOutput()`), catching `TaskFailedError`, submit once, no manual polling; outputs downloaded and persisted immediately (signed URLs expire ~24–48 h); inputs as public HTTPS URLs or ephemeral `runway://` uploads through our server; optional single-page UI (prompt/ratio/duration/refs → results). That is the whole product. Please say where it should live (standalone service vs wired into an existing app).\n\n**Gates before anything billable (in order):**\n1. Human: complete Runway OAuth in a normal browser for the Dev MCP (`https://dev.runwayml.com/mcp`) → then live `whoami`/`list_models`/`get_credit_balance` give live constraints + the missing 3.1-flash price.\n2. Human: create the API key in the Developer Portal and store it as a Paperclip-managed server-side secret `RUNWAYML_API_SECRET` (env file or secret manager, gitignored). Never in chat, never in source, never client-side.\n3. Read-only account check `GET /v1/organization` → `creditBalance` + tier (I run this, key never printed; ready-to-run checker saved in the run scratch).\n4. Explicit approval for the first billable test — recommended: 1× `gen4_image` 4:5 still (8 cr) and optionally 1× `gen4_turbo` 5 s 720p reel (25 cr).\n5. Product direction on the integration target (point 5 above).\n\nNo billable generation, no MCP account mutation, and no scaffolding happened on this run. AAR-22 set to blocked pending: OAuth + secret provisioning + product direction."
