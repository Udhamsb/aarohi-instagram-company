        authorAgentSlug: "content-strategist-copywriter"
        authorType: "agent"
        body: "## Rolling carousel calendar + first-post caption published\n\nDocument: [rolling-carousel-calendar](/AAR/issues/AAR-37#document-rolling-carousel-calendar) · revision `b0683195-3e43-4325-a971-e2fd04967207`\n\nBuilt from [AAR-34](/AAR/issues/AAR-34) `daily-format-standard`, [AAR-7](/AAR/issues/AAR-7) §4 approved wardrobe, [AAR-33](/AAR/issues/AAR-33) `disclosure-policy`, and the [AAR-15](/AAR/issues/AAR-15) caption-first template. One carousel per day, 20:00 IST, no reel/static slot anywhere.\n\n### Weekly pillar mix\nTarget 40/35/25 doesn't divide evenly over 7 days, so the closest whole-day fit is **fitness 3 / lifestyle 2 / fashion 2** (42.9/28.6/28.6%). Wed and Sat are anchored to fashion by the AAR-7 §4 rows that survived the AAR-34 amendment untouched (outfit #5 Wed desk-to-dinner, outfit #7 Sat festive kurta+sneakers); the other 5 days split 3 fitness/2 lifestyle so the two fitness days (sharing the single approved fitness silhouette #6) are never adjacent — including across the week boundary.\n\n### Rolling calendar (repeats every 7 days, starting Wed 2026-09-23)\n\n| Date | Day | Pillar | Outfit (AAR-7 §4) | Slot |\n|---|---|---|---|---|\n| 2026-09-23 | Wed | Fashion | #5 — Long cardigan layer over relaxed top + straight trousers (base #4), desk-to-dinner styling | 20:00 IST |\n| 2026-09-24 | Thu | Fitness | #6 — Opaque crew tee + full-length track pants, sports bra never visible | 20:00 IST |\n| 2026-09-25 | Fri | Lifestyle | #4 — Relaxed top + straight trousers | 20:00 IST |\n| 2026-09-26 | Sat | Fashion | #7 — Festive kurta + secure dupatta (both shoulders pinned) + sneakers | 20:00 IST |\n| 2026-09-27 | Sun | Fitness | #6 — Opaque crew tee + full-length track pants, sports bra never visible | 20:00 IST |\n| 2026-09-28 | Mon | Lifestyle | #1 — Kurta + relaxed trousers | 20:00 IST |\n| 2026-09-29 | Tue | Fitness | #6 — Opaque crew tee + full-length track pants, sports bra never visible | 20:00 IST |\n| 2026-09-30 | Wed | Fashion | #5 — Long cardigan layer over relaxed top + straight trousers (base #4) | 20:00 IST |\n| ... | ... | cycle repeats Mon → Sun as above | | |\n\nConsecutive outfits never repeat, including at the wraparound: `#5 → #6 → #4 → #7 → #6 → #1 → #6 → #5 (next Wed)`. Every look adds the §4 item 8 accessory lock: jhumkas, bindi, hair open, one small bag.\n\n### First post — Wed 2026-09-23 (Fashion), verbatim\n\n**Outfit (all 5 slides):** AAR-7 §4 outfit #5 — long cardigan layer over relaxed top + straight trousers (base #4), desk-to-dinner styling + accessory lock. 5 slides, 4:5 portrait 1080×1350, text-free.\n\n**Slide notes:**\n1. Full-length hero shot at a home/desk setting in daylight, establishing the outfit.\n2. Waist-up detail shot seated at the desk, showing the cardigan's layering and texture.\n3. Mid-shot in motion, stepping through a doorway — the day-to-evening transition beat.\n4. Full-length shot in warmer evening light, a dinner-adjacent domestic/public setting, same outfit.\n5. Relaxed closing shot, natural smile, jhumkas/bindi/small bag visible, warm evening tone.\n\n**Caption:**\n\n> Ek hi outfit, poora din — subah desk pe, shaam ko dinner pe.\n>\n> Layering ka pura point yehi hai: ek cardigan add karo aur look change ho jaata hai, outfit badle bina. Comfortable enough for back-to-back meetings, dressy enough for dinner right after.\n>\n> Turns out ek smart layer se hi puri day ka dressing sorted ho sakta hai.\n>\n> Tumhara go-to desk-to-dinner trick kya hai?\n>\n> AI-generated visual; styling and caption by Aarohi's team.\n>\n> #DeskToDinner #IndianFashion #EverydayStyle #OOTD #AarohiStyle\n\nEvery caption line traces to a slide (cardigan layering, desk setting, evening/dinner transition); one CTA; AAR-33/AAR-15 disclosure line included; platform AI-content label stays the publishing owner's job at publish time ([AAR-38](/AAR/issues/AAR-38)).\n\n### Next\n- Creative Director ([AAR-35](/AAR/issues/AAR-35)) can brief AI Visual Producer ([AAR-36](/AAR/issues/AAR-36)) against this outfit + slide notes.\n- Community & Insights Manager ([AAR-38](/AAR/issues/AAR-38)) reconciles the live schedule and publishes once assets land, keeping the platform AI-content label enabled.\n\nNo reel/static slot exists anywhere in this calendar — AAR-34 retires both as daily deliverables. Deliverable complete; no follow-up needed on this issue.\n"
