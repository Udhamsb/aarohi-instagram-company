        authorAgentSlug: "creative-director"
        authorType: "agent"
        body: "# AAR-25 complete — Aarohi Visual Production Acceptance Standard v1.0 + preflight checklist\n\nDelivered as two locked documents on this issue:\n\n- [Aarohi Visual Production Acceptance Standard v1.0 — Zero Text + Character Consistency](/AAR/issues/AAR-25#document-production-standard-v1) — the consolidated acceptance standard.\n- [Aarohi Production Preflight Checklist v1.0 (AAR-25 handoff gate)](/AAR/issues/AAR-25#document-preflight-checklist-v1) — the print-and-run companion the AI Visual Producer executes as the final pre-handoff self-check.\n\nBoth are usable immediately as the handoff gate defined in AAR-27. The receiving publish/QA gate refuses any asset without a passing preflight record (§7 of the standard). No billable generation was performed or authorized by this issue.\n\n## What the standard locks in\n\n**Zero text — absolute (§1, rules Z-0 to Z-5).** A delivered image or video frame contains zero visible text: typography, captions, signs, labels, packaging text, screen/UI content, watermarks, logos, subtitles, AND accidental glyphs — pseudo-text and hallucinated letterforms fail exactly like legible words, even one character. Prompts never request text (Z-1); every prompt carries the verbatim negative block (Z-2); the only permitted on-asset text is the post-production `AI-generated` overlay or a board-approved campaign exception (Z-3); compliance is verified by measurement on the delivered bytes, not by prompt intent (Z-5).\n\n**Character consistency (§2, rules C-1 to C-8).** Generation conditions on the approved anchor set with SHA-256 provenance (RC-9); the identity/marker locks (wheatish skin, long open dark hair never tied, maroon bindi, silver jhumkas) are per-frame requirements for video; only the eight approved wardrobe silhouettes; the hair-only camisole rule carries forward; any drift is an immediate reject.\n\n**Framing, wardrobe, setting, safety, continuity (§3).** Eye-level framing with no body-focused crops; approved-settings list and prohibited intimate settings; modesty of pose and copy; safe-area disclosure overlay with the AAR-11 platform numbers; internal/outward master separation; no real likenesses/brand marks; continuity within sets, within videos, and across packages.\n\n**Multi-pass preflight (§4).** Pass 0 brief/cost completeness (blocks billable spend, requires the AAR-27 estimate + confirm_cost gate before any render), Pass 1 automated QC (measured dimensions — explicit width×height, never a bare ratio string; audio-stream check; automated zero-text scan; badge bit-match, contrast, margins, guard band, phone round-trip), Pass 2 per-frame visual review at full size + 4x zoom, Pass 3 platform preview (4:5 grid crop, 9:16 UI reservations) and handoff record. Video sampling: ≥10 frames, always including first and last.\n\n**Objective pass/fail (§5).** Twelve numeric thresholds, e.g. T-1: 0 text instances per frame (any 1 = fail); T-2: badge contrast ≥4.5 on the delivered convention; T-5/T-6: 100% of ≥10 sampled frames identity- and wardrobe-compliant (any 1 frame out = fail); T-7: measured (not requested) resolution; T-11: ≤2 correction cycles.\n\n**Single consolidated correction brief (§6).** On any failure: freeze, consolidate ALL defects from ALL passes into one brief with a defect table (rule | finding | POST-EDIT or REGEN | exact remedy), ship all regen defects in one revised prompt/one render call with the failing constraint front-loaded in both blocks, all post-edit defects in one re-edit session, then a full re-preflight from Pass 1. Third failing pass escalates to the Creative Director with no further spend.\n\n## Reconciliations with earlier standards (§0 of the document)\n\n- **Disclosure timing:** generation prompts must NOT request the on-image disclosure; the exact `AI-generated` overlay is applied in post-production on the raw master (supersedes the Persona Bible §3 prompt line; §4 disclosure requirements unchanged at the overlay stage — the AAR-20-proven practice).\n- **Pseudo-text:** glyph-like marks are now defects on the delivered asset (supersedes the earlier \"illegible blur passes\" convention; matches the AAR-14 rejection-loop precedent).\n- **Model/pricing/spend** stays with AAR-27; this standard is model-agnostic and measures delivered files.\n\n## Checklist (the gate in one view)\n\n**Pass 0 — before any generation call:** approved brief (P0-1); verbatim negative block (P0-2); zero text-requesting phrases (P0-3); surface exclusions for implied boards/screens/shelves (P0-4); anchor + SHA-256 (P0-5); explicit width×height, never a bare ratio (P0-6); platform spec achievable (P0-7); AAR-27 cost gate — live estimate + confirm_cost before any billable render (P0-8); ≤2-cycle correction budget (P0-9).\n\n**Pass 1 — automated:** measured container/dimensions = ordered spec (P1-1); reels carry a real audio stream (P1-2); zero-text scan on full still / every sampled frame, tool + verdict recorded (P1-3); badge bit-match on the exact string `AI-generated` (P1-4); badge contrast ≥4.5 (P1-5); margins ≥24 px inside the platform safe area (P1-6); 30 px guard band clear (P1-7); phone round-trip 420 px JPEG q26 readable (P1-8); SHA-256 + one file per live name (P1-9). Video sampling before Pass 2: ≥10 evenly spread frames, first and last included.\n\n**Pass 2 — visual/vision, every sampled frame:** identity vs anchor, no blending/age/complexion drift (P2-1); markers — hair open, bindi, jhumkas (P2-2); approved wardrobe only, modest and opaque (P2-3); zero-text at 4x including accidental glyphs (P2-4); no camisole inheritance (P2-5); anatomy (P2-6); realism/no artifacts (P2-7); lighting consistency (P2-8); framing + 4:5 grid survival (P2-9); non-intimate setting (P2-10); pose/likelihood/IP/privacy safety (P2-11); brief relevance (P2-12); video motion continuity (P2-13); set continuity (P2-14).\n\n**Pass 3 — platform + record:** grid crop and UI reservations clear, phone-readable (P3-1); disclosure overlay on every slide/shot (P3-2); complete asset record (P3-3); internal/outward labelling (P3-4); correction history (P3-5); ACCEPT only when every rule passes (P3-6).\n\n**Correction brief format:** one table per cycle — rule ID | finding (what/where/which frame) | POST-EDIT or REGEN | exact remedy. All REGEN rows in one render call; all POST-EDIT rows in one re-edit session; full re-preflight after; third failure escalates.\n\n## Verification trail\n\nBuilt from the locked prior art rather than from scratch: AAR-2 Persona Bible (identity/modesty/disclosure), AAR-7 reference pack v2.1 (anchors, RC-1–RC-10, hair-only rule, safe-area gates), AAR-12/13/14/15 (clean-image, approval, generation QC, caption-first), AAR-11 (exact 1080×1920 safe-area numbers), AAR-17/AAR-19/AAR-20 render lessons (explicit width×height vs ignored ratios, per-frame gates, consolidated rev-2 wardrobe fix, post-production overlay), AAR-21/22 (Runway path), AAR-27 (cost gate). Where this standard tightens or supersedes an earlier convention, §0 says so explicitly.\n\nHandoff to the AI Visual Producer: run Passes 0–3 on the AAR-26 prompt package as soon as it lands; AAR-27's ready/not-ready decision should reference this gate."
