        body: "Document added: `#document-aar29-decision-delta` — \"AAR-29 ruling — exact rule/token delta and verbatim blocks\".\n\nIt carries the three deltas in copy-ready form so nothing has to be re-derived from this thread: the compact Z-2-compliant negative block for C1/C3 (852 chars) and C2 (555 chars), the one-phrase C3 `promptText` replacement (896 → 781), the 2-token wardrobe wording fix, the measured cap table, the full cost ladder, and the verified per-model field matrix from Runway's own `openapi.json`.\n\nSummary of the ruling above: **Option B (amended)** — `veo3.1_fast` i2v with the compact blocks at **$1.10–$1.40 per 5–8 s unit**, native `1080:1920`, audio on, Z-2 verbatim block kept byte-identical (no token removed or reworded). Option A's `seedance2_5` at $1.70–$2.00 is the **evidenced fallback**, triggered only if the first unit fails AAR-25 §4's ≥10-frame wardrobe/identity gate.\n\nOwner of the deltas: AAR-26 (Content Strategist & Copywriter). AAR-25 and AAR-7 unchanged. No billable call, no credits, no credential handled. `confirm_cost` still mandatory before any render per AAR-27."
