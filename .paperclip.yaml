        authorAgentSlug: "ai-visual-producer"
        authorType: "agent"
        body: "Week 1 assets are delivered. The supplied anchor set closed the §7 render gate, so I produced and uploaded the visual package instead of staying paused.\n\n**11 assets uploaded to this issue** (all verified present, not just \"call returned 201\"):\n\n- 5 reel masters, 1080x1920: `AAR-W1-MON-REEL`, `-WED-`, `-THU-`, `-SAT-`, `-SUN-`\n- 5 carousel slides, 1080x1350: `AAR-W1-TUE-CAR-S1…S5`\n- 1 static, 1080x1350: `AAR-W1-FRI-STATIC`\n\nDocs: [AAROHI_WEEK_1_PRODUCTION_PACKAGE_v2.md](/api/attachments/3cc9fa8a-4e59-4b42-a54a-4c19a8ff0586/content) · [AAROHI_WEEK_1_QA_EVIDENCE.md](/api/attachments/ddfde158-beca-41a5-a90f-9e96e80976c5/content)\n\n**Mix verified:** fitness Mon/Thu/Sun = 3 · lifestyle Tue/Fri = 2 · fashion Wed/Sat = 2. Formats: 5 reels + 1 five-slide carousel + 1 static. All seven posts carry treatment/shot list, script/voiceover, caption, CTA, hashtag set, prompt + exclusion blocks.\n\n**Disclosure — measured, not asserted.** All 11 frames carry the exact hyphenated `AI-generated` in the lower-right safe area. Machine QA from the delivered pixels: 7.22:1 contrast (AA needs 4.5), 11/11 lower-right, 11/11 unclipped, 110 px bottom margin on reels (clear of the reel UI zone). §4 phone-preview gate run as an actual downscale + JPEG q26 round-trip: 11/11 pass at 45–52:1 with 15–17% surviving glyph coverage. Every carousel slide has its own badge; no slide exempt.\n\n**Identity:** exact, because there is no generative step. Each frame is a deterministic composition built from a registered crop of the approved anchor sheet, SHA-256 recorded per asset and re-checked in QA. Face drift is structurally impossible — but see the scope note, because that is also the limitation.\n\n**Scope note — please read before approving.** No image-generation provider is reachable from this runtime (no image credential; the only model provider is a text LLM; connection search returns 404 and the tool gallery is board-restricted). I did not fabricate frames. So these are **composite masters**, not new scene photography:\n\n- The Friday static and the five Tuesday carousel slides are **production-ready as final compositions**.\n- The five reel assets are **cover/shot-card masters** — the frame carrying script, timings and disclosure. The per-shot b-roll for the 15–20 s cuts still needs a generator or a shoot. I have not presented the reel covers as if they were the full motion asset.\n\n**Two §7 gaps I found and contained rather than papered over:**\n\n1. **No §7.3 wardrobe reference exists.** The supplied sheet's \"Open Hair\" panel shows a thin camisole strap over a bare shoulder — not an approved silhouette, and §1 would carry it into every generation. I re-cropped all anchors to end above the shoulders so no frame inherits it. That is why the delivered assets are portrait-led. Outfit-led frames stay blocked.\n2. **The supplied anchor sheets do not carry the §7.1 `AI-generated` disclosure.** My assets comply; the reference pack does not. If those sheets are ever published or reposted, they breach §4 today.\n\n**QA records** cite Persona Bible criteria per asset. §1 identity/hair/bindi/jhumkas and §4 label: **PASS** on all 11. §2 wardrobe/pose/setting: **BLOCKED §7.3** on the outfit-led posts — declared, not hidden. §5 exercise form: **N/A for stills** (a head crop cannot show knee tracking), with the form-rejection rules pre-written in §6 of the package so nothing slips when b-roll lands.\n\n**Delegated follow-ups:**\n\n- **AAR-7** → Creative Director: re-issue the reference pack with a §7.3 wardrobe set and the §7.1 label. Blocks all outfit-led frames.\n- **AAR-8** → unassigned for board routing: connect an image-generation provider, or approve a shoot, or descope. I could not assign it to the Chief of Staff — correct guardrail, since that is the agent who delegated AAR-3 to me.\n- **AAR-9** → Content Strategist & Copywriter: the §2 modesty and §6 caption/sequence preflight lanes. Handed over rather than self-certified, per the bible.\n\nHousekeeping: I created and then cancelled **AAR-6** (`__probe__`) — an accidental issue from validating the issue-creation request shape. It is cancelled with an explanatory comment; no action needed.\n\nMoving this to **in_review** with a live path: reviewer feedback here, plus AAR-7/8/9 as named owners for the three open blockers.\n"
